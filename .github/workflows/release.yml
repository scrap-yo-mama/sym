# Chaîne de release (tâche 4.9, 08b §5, 14 §6, 16 §3). Déclenchée par une étiquette SemVer seulement, jamais par une
# branche ni une PR. L'environnement `release` (réglages du dépôt : relecteurs obligatoires, branches et étiquettes
# protégées) doit approuver chaque exécution AVANT que le jeton d'écriture et l'OIDC soient accordés.
#
# Produit : image GHCR amd64 `X.Y.Z` (`X.Y`, `X`, `stable` pour une version stable ; `X.Y.Z-beta.N`, `beta` pour une
# beta ; jamais de tag flottant `latest`), archive de l'extension + SHA-256, SBOM CycloneDX (lockfile et image), signature
# cosign SANS clé (identité du workflow, OIDC GitHub, journal Rekor), SBOM attesté, attestation de provenance (SLSA Build L2
# visé). Aucun cache : un cache empoisonné ne doit jamais entrer dans un artefact signé.
# La provenance dit qui a construit et d'où, pas que l'artefact est sain : d'où le délai de 7 jours sur les dépendances,
# l'absence de scripts d'installation et les portes ci-dessous.
# Répétition : `pnpm release:dry-run` rejoue la chaîne en local (clé de test, rien n'est publié).
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'

permissions:
  contents: read

defaults:
  run:
    working-directory: runtime

jobs:
  # Landing, liens externes du site construit en 200 avant toute publication (assert_landing_links_resolve, 22b § 4). Job à part, en
  # lecture seule et sans environnement : le build VitePress (binaire natif de Pagefind) et les connexions sortantes vers des pages
  # externes ne tournent pas dans le job qui détient l'écriture des paquets et l'OIDC de signature ; la release en dépend (needs).
  landing-links:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      PUBLIC_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Site de doc et landing construits, liens externes en 200 (hors exceptions documentées)
        run: |
          pnpm docs:build
          pnpm --filter @runtime/docs landing:links

  release:
    needs: landing-links
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # joindre les fichiers à la release GitHub
      packages: write # pousser l'image vers GHCR
      id-token: write # signature sans clé (OIDC) et attestations
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # historique complet : audit X6 de l'historique avant toute release publique (_exclusions X6)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Portes : mêmes contrôles que la CI, rejoués sur l'étiquette.
      - name: Portes (X6 sur l'index et sur tout l'historique git, versions épinglées, liste noire, licences par paquet, workflows)
        run: |
          pnpm check:x6
          pnpm check:x6-history
          pnpm check:deps-pinned
          pnpm check:blacklist
          pnpm check:licenses
          pnpm check:release
      - name: Plan de release (étiquette, canal, tags d'image ; la version du package.json doit être celle de l'étiquette)
        id: plan
        run: |
          repo="ghcr.io/${REPOSITORY}"
          echo "image=${repo,,}" >> "$GITHUB_OUTPUT"
          node scripts/release/plan.ts "$TAG" "$repo"

      - name: Identité publique (PUBLIC_REPOSITORY doit égaler GITHUB_REPOSITORY sur le dépôt public ; 22 §3.1)
        env:
          PUBLIC_REPOSITORY: ${{ vars.PUBLIC_REPOSITORY }}
        run: node scripts/vitrine/check.mjs identity

      - name: Archive de l'extension, SHA-256 et SBOM du lockfile (CycloneDX 1.7)
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          mkdir release-out
          rm -f apps/extension/dist/*.zip
          pnpm --filter @runtime/extension exec wxt zip
          cp apps/extension/dist/*-"${VERSION}"-chrome.zip "release-out/scrapyomama-extension-${VERSION}.zip"
          pnpm sbom --sbom-format cyclonedx --sbom-spec-version 1.7 --lockfile-only --out release-out/sbom-lockfile.cdx.json
          node scripts/release/sbom.ts release-out/sbom-lockfile.cdx.json

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image GHCR (amd64, sans cache)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: runtime
          file: runtime/deploy/Dockerfile
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: ${{ steps.plan.outputs.tags }}
          build-args: |
            RUNTIME_VERSION=${{ steps.plan.outputs.version }}
            PUBLIC_REPOSITORY=${{ github.repository }}
          provenance: mode=max
          sbom: false

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        id: syft
        with:
          syft-version: v1.51.1
      - name: SBOM de l'image (CycloneDX 1.7, validé)
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          IMAGE: ${{ steps.plan.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          "$SYFT" "${IMAGE}@${DIGEST}" -o cyclonedx-json@1.7=release-out/sbom-image.cdx.json
          node scripts/release/sbom.ts --image release-out/sbom-image.cdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3 # même version que la CI et la release à blanc
      - name: Signature cosign sans clé, SBOM attesté (image) ; signature des fichiers
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type cyclonedx --predicate release-out/sbom-image.cdx.json "${IMAGE}@${DIGEST}"
          (cd release-out && sha256sum scrapyomama-extension-*.zip sbom-*.cdx.json > SHA256SUMS)
          for f in release-out/*.zip release-out/sbom-*.cdx.json release-out/SHA256SUMS; do
            cosign sign-blob --yes --bundle "${f}.bundle" "$f"
          done

      - name: Provenance de l'image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.plan.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Provenance de l'archive de l'extension
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: runtime/release-out/scrapyomama-extension-*.zip

      # assert_media_index_current (22b §3, §5) : une MINOR dont MEDIA.md ne cite ni la version ni une URL user-attachments
      # est publiée en brouillon ; elle sort du brouillon à la main, une fois la vidéo envoyée et MEDIA.md à jour.
      - name: Index des vidéos (MEDIA.md) à jour pour une MINOR ?
        id: media
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/vitrine/check.mjs media "$VERSION"
      - name: Release GitHub (fichiers joints ; notes générées si release-please n'a pas créé la release ; brouillon si MEDIA.md n'est pas à jour)
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
          DRAFT: ${{ steps.media.outputs.draft }}
        run: |
          flags=()
          if [ "$CHANNEL" = beta ]; then flags+=(--prerelease); fi
          if [ "$DRAFT" = true ]; then flags+=(--draft); fi
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes "${flags[@]}"
          if [ "$DRAFT" = true ]; then gh release edit "$TAG" --draft=true; fi
          gh release upload "$TAG" release-out/* --clobber

      # Piège GHCR (tâche 4.1, 14 § 12) : un paquet est PRIVÉ à sa première publication. Render, Railway, Heroku et les machines
      # Docker des utilisateurs ne pourraient pas tirer l'image. Dernière étape, après la release : un échec ici ne retire
      # rien, il dit de rendre le paquet public (réglages du paquet, une seule fois) puis de relancer le script.
      - name: Image publique (tirage anonyme du manifeste)
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: sh deploy/check-image-public.sh "${IMAGE}:${VERSION}"
