# Workflow nocturne créé mais DÉSACTIVÉ : déclencheur manuel seul.
# Pour l'activer (tâche 4.x) : ajouter un déclencheur `schedule` (cron).
name: nightly

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: runtime

jobs:
  nightly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile
      - run: 'echo "nightly : pas encore implémenté (k6, tests instables, N2) ; Node 26 du bac à sable : job security de ci.yml"'
