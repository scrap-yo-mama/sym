# CI de runtime/ : 7 jobs (cdc/scrapyomama-runtime/15-strategie-tests.md §2), plus le job `docs` (tâche 4.8) et le job `image` (privilèges du bac à sable sur l'image construite, F-20261001-R01).
# Aucun filtre de chemin : `quality` ne doit jamais être masqué.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: runtime

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # historique complet : audit X6 de l'historique (et release à blanc)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Garde X6 (aucun .py ni .ipynb ni nom suspect dans tout le dépôt, depuis la racine)
        working-directory: .
        run: node runtime/scripts/check-x6.ts
      - name: Garde X6 sur tout l'historique git (assert_x6_history_clean)
        working-directory: .
        run: node runtime/scripts/check-x6.ts --history
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Langues (parité de toutes les surfaces, clés typées, pseudo-locale ; tâche 3.20)
        run: pnpm i18n:check
      - run: pnpm knip
      - name: Table invariants vers tests nommés (15 §12)
        run: pnpm check:invariants
      - name: Versions exactes, actions et images épinglées (assert_deps_pinned)
        run: pnpm check:deps-pinned
      - name: Liste noire INV6 (lockfile)
        run: pnpm check:blacklist
      - name: Scan des licences, global et par paquet (assert_licenses_compatible ; client et schemas MIT sans copyleft)
        run: pnpm check:licenses
      - name: Workflows et image de release (assert_release_gates)
        run: pnpm check:release
      - name: Commit conventionnel (titre de la PR, 16 §3)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/release/conventional.ts
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Release à blanc (SBOM, signature avec une clé de test, vérification ; rien n'est publié)
        run: pnpm release:dry-run
      # À venir : vue-tsc (tâche 3.x).

  docs:
    # Tâche 4.8 : site de doc (VitePress, Pagefind, llms.txt) construit à chaque PR, 0 lien mort ; tutoriel « Démarrage rapide »
    # rejoué sur une instance vierge (PostgreSQL jetable par Testcontainers, processus de l'image, aucune connexion hors de la
    # machine). Rien n'est publié : la sortie du site (apps/docs/dist) n'est pas déployée.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Site de doc (construction, 0 lien mort, llms.txt, index Pagefind) et tests de contenu
        run: pnpm docs:test
      - name: Quickstart rejoué sur une instance vierge
        run: pnpm docs:quickstart

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # historique complet : le test unitaire assert_x6_history_clean audite l'historique réel (assert_ci_full_history)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: runtime/coverage/
          if-no-files-found: error
          retention-days: 14
      # Seuils de couverture fixés après la W0 ; aucun envoi à un service tiers.

  integration:
    # Matrice PostgreSQL 16, 17, 18 (14 § 4, 15 § 5). Chaque job démarre son conteneur par Testcontainers
    # (tests/setup/postgres.global.ts), une base par fichier de test.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17", "18"]
    env:
      PG_VERSIONS: ${{ matrix.pg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Intégration sur PostgreSQL ${{ matrix.pg }} (migrations, verrou, aller-retour, partitions)
        run: pnpm test:integration
      - name: Contrats (une seule fois)
        if: matrix.pg == '16'
        run: pnpm vitest run --project contract

  api-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile
      - run: 'echo "api-contract : pas encore implémenté (tâches 3.1 et 3.2 : Schemathesis en image Docker, conformité MCP)"'

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Chromium de Playwright (extension en contexte persistant, nouveau mode headless)
        run: pnpm exec playwright install --with-deps chromium
      # E2 extension (tâche 2.6) : PostgreSQL 16 jetable (Testcontainers), sites de fixtures en boucle locale.
      - run: pnpm test:e2e
      # Gate d'accessibilité de la console (tâche 3.9) : axe sur chaque écran (clair, sombre, en, fr), parcours au clavier seul, live
      # regions, reflow à 320 px ; la console est construite et servie en local par le test (apps/web/e2e). Parcours d'invitation
      # (tâche 3.8) : la console construite contre une instance réelle (PostgreSQL 16 jetable, serveur en écoute), runtime/tests/e2e. À venir :
      # la suite E2E complète de la console (3.6), shardée, rapport blob fusionné.

  security:
    # Bac à sable (tâche 1.5, D-24) : matrice Node 24 (.node-version, suite complète) et Node 26 (isolated-vm 7.0.1,
    # ABI 147 ; suite du bac à sable seule), à chaque PR. engines limite l'installation à Node 24 : engine-strict levé
    # pour Node 26 seulement.
    name: security (Node ${{ matrix.label }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "24"
            node: ""
          - label: "26"
            node: "26"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # historique complet : le job lance vitest sur le projet unit (assert_ci_full_history)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Vide : .node-version (Node 24).
          node-version: ${{ matrix.node }}
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile ${{ matrix.node == '26' && '--config.engine-strict=false' || '' }}
      - run: pnpm build
      - name: Utilisateur dédié du bac à sable, comme deploy/Dockerfile (uid 1500, lanceur setpriv à capacités)
        run: |
          sudo apt-get install -y --no-install-recommends libcap2-bin
          sudo groupadd --system --gid 1500 sandbox
          sudo useradd --system --uid 1500 --gid 1500 --no-create-home --home-dir /nonexistent --shell /usr/sbin/nologin sandbox
          sudo install -d -m 0755 /usr/local/libexec
          sudo install -o root -g "$(id -gn)" -m 0750 /usr/bin/setpriv /usr/local/libexec/sandbox-launch
          sudo setcap cap_setuid,cap_setgid=ep /usr/local/libexec/sandbox-launch
          # L'enfant lit son script et les paquets du moteur dans l'espace de travail : traversée des dossiers parents.
          d="$GITHUB_WORKSPACE"; while [ "$d" != / ]; do sudo chmod o+x "$d"; d="$(dirname "$d")"; done
          { echo SANDBOX_UID=1500; echo SANDBOX_GID=1500; echo SANDBOX_LAUNCHER=/usr/local/libexec/sandbox-launch; } >> "$GITHUB_ENV"
      - name: Chromium de Playwright (garde SSRF via le proxy d'egress, INV10)
        if: matrix.node == ''
        run: pnpm exec playwright install --with-deps chromium
      # Tâche 1.6 : Chromium du worker lancé AVEC son bac à sable (chromiumSandbox: true, jamais --no-sandbox). Ubuntu
      # 24.04 restreint les espaces de noms utilisateur non privilégiés par AppArmor : levée sur le runner de test seulement.
      - name: Bac à sable de Chromium (espaces de noms utilisateur)
        if: matrix.node == ''
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Aucune relance : un échec instable doit rester visible (rapport junit archivé).
      - if: matrix.node == ''
        run: pnpm test:security --retry=0 --reporter=default --reporter=junit --outputFile.junit=reports/security-junit.xml
      - name: assert_sandbox et borne isolated-vm sur Node 26
        if: matrix.node == '26'
        run: pnpm vitest run --project unit --project security --retry=0 --reporter=default --reporter=junit --outputFile.junit=reports/security-junit.xml apps/worker/src/sandbox
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: security-junit-node${{ matrix.label }}
          path: runtime/reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: pnpm audit (avertissement au début, bloquant plus tard)
        if: matrix.node == ''
        continue-on-error: true
        run: pnpm audit --audit-level=critical

  image:
    # assert_sandbox_image_privileges (INV7, constat F-20261001-R01) : l'image construite (deploy/Dockerfile, rien n'est
    # poussé) démarrée sous les capacités de Render (no-new-privileges) puis en Docker classique : descente root → pwuser,
    # capacités de chaque processus, bac à sable sous l'uid dédié, sonde de santé du compose, arrêt propre. Seule preuve sur
    # l'image du modèle de privilèges : la porte statique (assert_image_nonroot) ne fait que la compléter.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile
      # La sonde lance Chromium AVEC son bac à sable (chromiumSandbox: true) dans le conteneur : espaces de noms
      # utilisateur non privilégiés, restreints par AppArmor sur Ubuntu 24.04 (levée sur le runner de test seulement).
      - name: Bac à sable de Chromium (espaces de noms utilisateur)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Aucune relance : un échec instable doit rester visible (rapport junit archivé).
      - run: pnpm test:image --retry=0 --reporter=default --reporter=junit --outputFile.junit=reports/image-junit.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: image-junit
          path: runtime/reports/
          if-no-files-found: ignore
          retention-days: 14

  nightly:
    # Ne s'exécute jamais depuis ce workflow (aucun déclencheur cron ici) : voir nightly.yml.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - run: 'echo "nightly : pas encore implémenté (k6, N2, Node 26)"'
