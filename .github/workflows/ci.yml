# CI de runtime/ : 7 jobs (cdc/scrapyomama-runtime/15-strategie-tests.md §2), plus le job `docs` (tâche 4.8), le job `image` (privilèges du bac à sable sur l'image construite, F-20261001-R01), le 8e job `vitrine` (tâches 4.12 et 4.11 : vitrine du dépôt puis landing).
# Aucun filtre de chemin : `quality` ne doit jamais être masqué.
# Modules (ADR 23 § 6) : le job `detect` liste les paquets touchés et leurs dépendants (`pnpm --filter "...[origin/main]"`), le job
# `browser` (module SYM Browser) ne tourne que s'ils le concernent, et `gate` agrège le verdict de tous les jobs : c'est le check à exiger.
name: ci

on:
  push:
    # ci/** : branches candidates de fusion poussées par l orchestrateur (D-55), testées ici plutôt que sur la machine locale.
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: runtime

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # historique complet : audit X6 de l'historique (et release à blanc)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Garde X6 (aucun .py ni .ipynb ni nom suspect dans tout le dépôt, depuis la racine)
        working-directory: .
        run: node runtime/scripts/check-x6.ts
      - name: Garde X6 sur tout l'historique git (assert_x6_history_clean)
        working-directory: .
        run: node runtime/scripts/check-x6.ts --history
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm knip
      - name: Table invariants vers tests nommés (15 §12)
        run: pnpm check:invariants
      - name: Versions exactes, actions et images épinglées (assert_deps_pinned)
        run: pnpm check:deps-pinned
      - name: Liste noire INV6 (lockfile)
        run: pnpm check:blacklist
      - name: Scan des licences, global et par paquet (assert_licenses_compatible ; client et schemas MIT sans copyleft)
        run: pnpm check:licenses
      - name: Workflows et image de release (assert_release_gates)
        run: pnpm check:release
      - name: Commit conventionnel (titre de la PR, 16 §3)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/release/conventional.ts
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Release à blanc (SBOM, signature avec une clé de test, vérification ; rien n'est publié)
        run: pnpm release:dry-run
      # À venir : vue-tsc (tâche 3.x).

  docs:
    # Tâche 4.8 : site de doc (VitePress, Pagefind, llms.txt) construit à chaque PR, 0 lien mort ; tutoriel « Démarrage rapide »
    # rejoué sur une instance vierge (PostgreSQL jetable par Testcontainers, processus de l'image, aucune connexion hors de la
    # machine). Rien n'est publié : la sortie du site (apps/docs/dist) n'est pas déployée.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Site de doc (construction, 0 lien mort, llms.txt, index Pagefind) et tests de contenu
        run: pnpm docs:test
      - name: Quickstart rejoué sur une instance vierge
        run: pnpm docs:quickstart

  vitrine:
    # Tâche 4.12 (22 §3.6, 22b §5) : vitrine du dépôt (README en et fr, visuels et budgets de poids, registre des allégations,
    # licence, formulaires, étiquettes OCI, filtre par chemin). Node seulement : scripts/vitrine/check.mjs et les tests nommés
    # de tests/vitrine (aucun .py, aucun service tiers). Le filtre par chemin est celui de CE job (check.mjs changed), jamais un
    # filtre du workflow : `quality` et les autres jobs ne sont jamais masqués. Rien n'est publié, poussé ni réglé sur GitHub.
    # Cible : moins de 3 minutes (à valider).
    # Tâche 4.11 (22b § 5) : gates de la landing sur la préproduction, c'est-à-dire le build de production du commit servi par un
    # serveur statique local qui reproduit GitHub Pages (chemin de base /sym/, aucun en-tête, CSP en balise meta). Rien n'est publié ni
    # déployé : GitHub Pages n'est touché qu'au GO. Critère de 4.11 : TOUS les assert_landing_* tournent ici, les tests de contenu et du
    # site construit (vitest, projets unit et contract, apps/docs/src/landing ; le job docs les rejoue avec le reste du site) puis le volet
    # Chromium : cookie, requêtes tierces, traceurs, CSP vue par le navigateur, axe, mouvement, budgets de poids.
    # Le volet « liens externes en 200 » de assert_landing_links_resolve (pnpm --filter @runtime/docs landing:links) ouvre des connexions
    # sortantes vers le dépôt public : il ne tourne pas ici (une PR ne dépend pas de l'état du dépôt public), mais avant le déploiement
    # dans pages.yml (mise en ligne, GO), dans release.yml avant toute publication, et chaque semaine après (landing-production.yml).
    # Le volet interne (0 lien mort, fichier et ancre) tourne ici et dans le job docs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # historique complet : le filtre par chemin compare à la branche de base, le registre lit les étiquettes de release
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile
      # Sans filtre : les preuves du registre sont des tests de tout le monorepo (une preuve supprimée ou renommée fait échouer le job).
      - name: Registre des allégations (preuves, relecture, CLAIMS.md à jour)
        run: node scripts/vitrine/check.mjs claims
      - name: La PR (ou le push) touche-t-elle la vitrine ? (README*, .github/**, apps/docs/**, docs/, deploy/, scripts/vitrine/**)
        id: changed
        env:
          VITRINE_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: node scripts/vitrine/check.mjs changed
      - name: Contrôles de la vitrine (budgets, parité en / fr, allégations, visuels, licence, surface du dépôt)
        if: steps.changed.outputs.run == 'true'
        run: node scripts/vitrine/check.mjs
      - name: Tests nommés de la vitrine (assert_readme_*, assert_social_preview_spec, assert_svg_safe, assert_license_detected_agpl…)
        if: steps.changed.outputs.run == 'true'
        run: pnpm vitest run --project unit tests/vitrine tests/public-showcase.unit.test.ts
      - run: pnpm build
      - name: Landing, contenu et site construit (assert_landing_* hors navigateur)
        run: pnpm vitest run --project unit --project contract apps/docs/src/landing
      - name: Chromium de Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Landing, préproduction (build de production servi comme GitHub Pages), gates Chromium
        run: pnpm --filter @runtime/docs test:e2e
      - name: Contrôles avant le GO (cookie, tiers, traceurs, CSP, formulaire) rejoués par la sonde, résultat daté archivé
        run: pnpm --filter @runtime/docs landing:probe --preprod --out ../../landing-probe-preprod.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: landing-probe-preprod
          path: runtime/landing-probe-preprod.json
          if-no-files-found: error
          retention-days: 14

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # historique complet : le test unitaire assert_x6_history_clean audite l'historique réel (assert_ci_full_history)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: runtime/coverage/
          if-no-files-found: error
          retention-days: 14
      # Seuils de couverture fixés après la W0 ; aucun envoi à un service tiers.

  integration:
    # Matrice PostgreSQL 16, 17, 18 (14 § 4, 15 § 5). Chaque job démarre son conteneur par Testcontainers
    # (tests/setup/postgres.global.ts), une base par fichier de test.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17", "18"]
    env:
      PG_VERSIONS: ${{ matrix.pg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Intégration sur PostgreSQL ${{ matrix.pg }} (migrations, verrou, aller-retour, partitions)
        run: pnpm test:integration
      - name: Contrats (une seule fois)
        if: matrix.pg == '16'
        run: pnpm vitest run --project contract

  eval:
    # Banc d'évaluation de l'agent, niveau N0 (tâche 2.8, 15 §11) : faux fournisseur scripté, fixtures locales, PostgreSQL
    # jetable (Testcontainers), worker réel ; gratuit et bloquant à chaque PR. Rapport par modèle (réussite d'enquête, « moins
    # cher atteint », pass^3, fausses réparations) publié dans le résumé du job et en artefact ; aucune connexion hors de
    # l'instance. N1 (PR touchant prompts, rôles, classifieur) et N2 (nuit) exigent une clé BYO réelle (« demander d'abord ») :
    # NON branchés en CI à la livraison de 2.8, lancés à la main (`pnpm eval --level N1|N2`, runtime/eval/README.md
    # « Branchement CI ») sur un exécuteur Linux ou Docker Desktop. Report consigné ; nightly.yml ne les joue pas encore.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Banc N0 (pnpm eval)
        run: pnpm eval
      - name: Rapport du banc dans le résumé du job
        if: always()
        run: cat eval/results/n0/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eval-n0
          path: runtime/eval/results/n0/
          if-no-files-found: warn
          retention-days: 14

  api-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile
      - run: 'echo "api-contract : pas encore implémenté (tâches 3.1 et 3.2 : Schemathesis en image Docker, conformité MCP)"'

  e2e:
    runs-on: ubuntu-24.04
    # Borne du job (D-88) : un blocage ne consomme jamais les 6 h du runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Chromium de Playwright (extension en contexte persistant, nouveau mode headless)
        run: pnpm exec playwright install --with-deps chromium
      # E2 extension (tâche 2.6) : PostgreSQL 16 jetable (Testcontainers), sites de fixtures en boucle locale.
      - run: pnpm test:e2e
      # Régression visuelle par langue (3.17, part de 3.6) : la suite visuelle de la console, sautée ci-dessus hors de l'image,
      # est comparée aux instantanés linux dans l'image Playwright épinglée de deploy/Dockerfile ; une référence absente échoue.
      # Le conteneur se borne lui-même (SYM_VISUAL_TIMEOUT_MS, 25 min, scripts/visual-image-bound.ts, D-88) ; l'étape en filet.
      - run: pnpm visual:image
        timeout-minutes: 30
      # Gate d'accessibilité de la console (tâche 3.9) : axe sur chaque écran (clair, sombre, en, fr), parcours au clavier seul, live
      # regions, reflow à 320 px ; la console est construite et servie en local par le test (apps/web/e2e). Parcours d'invitation
      # (tâche 3.8) : la console construite contre une instance réelle (PostgreSQL 16 jetable, serveur en écoute), runtime/tests/e2e. À venir :
      # la suite E2E complète de la console (3.6), shardée, rapport blob fusionné.

  security:
    # Bac à sable (tâche 1.5, D-24) : matrice Node 24 (.node-version, suite complète) et Node 26 (isolated-vm 7.0.1,
    # ABI 147 ; suite du bac à sable seule), à chaque PR. engines limite l'installation à Node 24 : engine-strict levé
    # pour Node 26 seulement.
    name: security (Node ${{ matrix.label }})
    runs-on: ubuntu-24.04
    env:
      # Node 26 : engines (>=24 <25) bloque aussi pnpm build et pnpm vitest, pas seulement l installation.
      npm_config_engine_strict: ${{ matrix.node == '26' && 'false' || 'true' }}
      pnpm_config_engine_strict: ${{ matrix.node == '26' && 'false' || 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "24"
            node: ""
          - label: "26"
            node: "26"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # historique complet : le job lance vitest sur le projet unit (assert_ci_full_history)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Vide : .node-version (Node 24).
          node-version: ${{ matrix.node }}
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile ${{ matrix.node == '26' && '--config.engine-strict=false' || '' }}
      - run: pnpm build
      # D-67 (précision, revue 4.1b) : ce job exécute le vrai balayage (kill -1 sous l'uid 1500, sandbox.security.test.ts) sur
      # un runner Linux jetable, sous l'uid dédié et sous le filtre SANDBOX_SECCOMP, comme dans l'image.
      - name: Utilisateur dédié du bac à sable, comme deploy/Dockerfile (uid 1500, filtre seccomp, lanceur setpriv à capacités)
        run: |
          sudo apt-get install -y --no-install-recommends libcap2-bin
          sudo groupadd --system --gid 1500 sandbox
          sudo useradd --system --uid 1500 --gid 1500 --no-create-home --home-dir /nonexistent --shell /usr/sbin/nologin sandbox
          sudo install -d -m 0755 /usr/local/libexec
          sudo install -o root -g "$(id -gn)" -m 0750 /usr/bin/setpriv /usr/local/libexec/sandbox-launch
          sudo setcap cap_setuid,cap_setgid=ep /usr/local/libexec/sandbox-launch
          # Filtre de l'enfant (revue 4.1b (4)), compilé par le gcc du runner : exécuté AVANT le lanceur, il lui transmet
          # cap_setuid,cap_setgid (=p).
          gcc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/sandbox-seccomp" deploy/sandbox-seccomp.c
          sudo install -o root -g "$(id -gn)" -m 0750 "$RUNNER_TEMP/sandbox-seccomp" /usr/local/libexec/sandbox-seccomp
          sudo setcap cap_setuid,cap_setgid=p /usr/local/libexec/sandbox-seccomp
          # L'enfant lit son script et les paquets du moteur dans l'espace de travail : traversée des dossiers parents.
          d="$GITHUB_WORKSPACE"; while [ "$d" != / ]; do sudo chmod o+x "$d"; d="$(dirname "$d")"; done
          { echo SANDBOX_UID=1500; echo SANDBOX_GID=1500; echo SANDBOX_LAUNCHER=/usr/local/libexec/sandbox-launch; echo SANDBOX_SECCOMP=/usr/local/libexec/sandbox-seccomp; } >> "$GITHUB_ENV"
      - name: Chromium de Playwright (garde SSRF via le proxy d'egress, INV10)
        if: matrix.node == ''
        run: pnpm exec playwright install --with-deps chromium
      # Tâche 1.6 : Chromium du worker lancé AVEC son bac à sable (chromiumSandbox: true, jamais --no-sandbox). Ubuntu
      # 24.04 restreint les espaces de noms utilisateur non privilégiés par AppArmor : levée sur le runner de test seulement.
      - name: Bac à sable de Chromium (espaces de noms utilisateur)
        if: matrix.node == ''
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Aucune relance : un échec instable doit rester visible (rapport junit archivé).
      - if: matrix.node == ''
        run: pnpm test:security --retry=0 --reporter=default --reporter=junit --outputFile.junit=reports/security-junit.xml
      - name: assert_sandbox et borne isolated-vm sur Node 26
        if: matrix.node == '26'
        run: pnpm vitest run --project unit --project security --retry=0 --reporter=default --reporter=junit --outputFile.junit=reports/security-junit.xml apps/worker/src/sandbox
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: security-junit-node${{ matrix.label }}
          path: runtime/reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: pnpm audit (avertissement au début, bloquant plus tard)
        if: matrix.node == ''
        continue-on-error: true
        run: pnpm audit --audit-level=critical

  image:
    # assert_sandbox_image_privileges (INV7, constat F-20261001-R01) : l'image construite (deploy/Dockerfile, rien n'est
    # poussé) démarrée sous les capacités de Render (no-new-privileges) puis en Docker classique : descente root → pwuser,
    # capacités de chaque processus, bac à sable sous l'uid dédié, sonde de santé du compose, arrêt propre. Seule preuve sur
    # l'image du modèle de privilèges : la porte statique (assert_image_nonroot) ne fait que la compléter.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile
      # La sonde lance Chromium AVEC son bac à sable (chromiumSandbox: true) dans le conteneur : espaces de noms
      # utilisateur non privilégiés, restreints par AppArmor sur Ubuntu 24.04 (levée sur le runner de test seulement).
      # Conséquence : un hôte Ubuntu 23.10+ aux réglages par défaut n'est pas couvert par ce job ; condition d'hôte
      # documentée comme non vérifiée (apps/docs/content/guides/docker-compose.md, docs/deploiement.md).
      - name: Bac à sable de Chromium (espaces de noms utilisateur)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Régime de sécurité de l'hôte, consigné avec le résultat (revue 4.1b) : profil seccomp par défaut et AppArmor
      # (docker-default) du runner, que Docker Desktop n'a pas.
      - name: Régime de sécurité de Docker (seccomp, AppArmor)
        run: |
          docker info --format '{{json .SecurityOptions}}'
          sudo cat /sys/kernel/security/apparmor/profiles 2>/dev/null | grep -i docker || echo "AppArmor : aucun profil docker chargé"
      # Aucune relance : un échec instable doit rester visible (rapport junit archivé).
      - run: pnpm test:image --retry=0 --reporter=default --reporter=junit --outputFile.junit=reports/image-junit.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: image-junit
          path: runtime/reports/
          if-no-files-found: ignore
          retention-days: 14

  nightly:
    # Ne s'exécute jamais depuis ce workflow (aucun déclencheur cron ici) : voir nightly.yml.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - run: 'echo "nightly : pas encore implémenté (k6, N2, Node 26)"'

  detect:
    # ADR 23 § 6 : paquets touchés depuis origin/main et leurs dépendants (`pnpm --filter "...[origin/main]"`). Sur un push de
    # main, la base est github.event.before (tous les commits du push, avance rapide comprise), avec repli sur HEAD~1 si elle
    # est nulle ou inconnue ; HEAD~1 sert aussi au lancement manuel sur main. Un fichier partagé du workspace (lockfile,
    # catalogue, tsconfig, lint, .npmrc, .node-version, scripts SPDX et licences du job browser, ce workflow) rejoue tous les
    # modules. Aucun filtre `paths:` : ce job tourne toujours et décide pour les jobs de module. Script testé par
    # modules/browser/tests/ci-detect.unit.test.ts (rejoué dans des dépôts jetables).
    runs-on: ubuntu-24.04
    outputs:
      browser: ${{ steps.affected.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # origin/main et l'historique pour la comparaison
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile
      - name: Paquets touchés et dépendants
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=origin/main
          if [ "$EVENT_NAME" = push ] && [ "$REF" = refs/heads/main ]; then
            base=HEAD~1
            if [ -n "${BEFORE:-}" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base=$BEFORE; fi
          elif [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            base=HEAD~1
          fi
          echo "Base de comparaison : $base"
          pnpm --filter "...[$base]" ls --depth -1 --json > "$RUNNER_TEMP/affected.json"
          node -e 'const l = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); for (const p of l) console.log(p.name);' "$RUNNER_TEMP/affected.json" | tee "$RUNNER_TEMP/affected.txt"
          browser=false
          if grep -Eq '^(@sym-browser/|@sym/contracts$)' "$RUNNER_TEMP/affected.txt"; then browser=true; fi
          if ! git diff --quiet "$base" -- pnpm-workspace.yaml pnpm-lock.yaml package.json .pnpmfile.cjs .npmrc .node-version tsconfig.base.json eslint.config.mjs scripts/spdx-headers.ts scripts/check-licenses.ts ../.github/workflows/ci.yml; then
            echo "Fichier partagé du workspace modifié : tous les modules sont rejoués."
            browser=true
          fi
          echo "browser=$browser" | tee -a "$GITHUB_OUTPUT"

  browser:
    # Module SYM Browser (cdc/sym-browser 06 tâche 0.1) : build, types, lint de frontière, SPDX, licences, tests du module et de
    # @sym/contracts, image non root + tini + seccomp. Même script que `pnpm --filter @sym-browser/module ci:local`.
    needs: detect
    if: needs.detect.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: runtime/.node-version
      - run: pnpm install --frozen-lockfile
      # Les tests sur Chromium réels lancent Chromium avec son bac à sable (jamais --no-sandbox), comme les jobs security et
      # image : Ubuntu 24.04 restreint par défaut les espaces de noms utilisateur non privilégiés.
      - name: Bac à sable de Chromium (espaces de noms utilisateur)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: CI du module SYM Browser
        run: node modules/browser/scripts/ci-local.ts

  gate:
    # Seul check à exiger (ADR 23 § 6) : échoue si un job a échoué ou a été annulé. Un job de module sauté (module non touché)
    # passe. `nightly` n’en fait pas partie (planifié seulement) ; tous les autres jobs y sont (tests/ci-detect.unit.test.ts).
    if: always()
    needs: [quality, docs, vitrine, unit, integration, eval, api-contract, e2e, security, image, detect, browser]
    runs-on: ubuntu-24.04
    # Pas de checkout : le dossier `runtime` du défaut du workflow n'existe pas ici.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Verdict agrégé
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Résultats des jobs : $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              failure|cancelled) echo "gate : au moins un job a échoué ou a été annulé."; exit 1 ;;
            esac
          done
          echo "gate : vert."
