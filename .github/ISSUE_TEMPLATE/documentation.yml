name: Documentation
description: Une page est fausse, incomplète ou manquante.
labels: ["documentation"]
body:
  - type: checkboxes
    id: perimetre
    attributes:
      label: Périmètre
      options:
        - label: Cette demande ne relève pas de la page « Hors périmètre » (`runtime/docs/hors-perimetre.md`).
          required: true
  - type: input
    id: page
    attributes:
      label: Page concernée
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Ce qui manque ou ce qui est faux
    validations:
      required: true
