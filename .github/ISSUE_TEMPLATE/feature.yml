name: Fonction
description: Proposer une nouvelle fonction ou une amélioration.
body:
  - type: checkboxes
    id: perimetre
    attributes:
      label: Périmètre
      options:
        - label: Cette demande ne relève pas de la page « Hors périmètre » (`runtime/docs/hors-perimetre.md`).
          required: true
  - type: textarea
    id: besoin
    attributes:
      label: Le besoin
      description: Quel problème voulez-vous résoudre, pour quel usage ?
    validations:
      required: true
  - type: textarea
    id: proposition
    attributes:
      label: Proposition
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
