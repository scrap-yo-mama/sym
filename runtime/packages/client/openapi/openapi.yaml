      description: >-
        Récit du run depuis le début (ou depuis `Last-Event-ID`), puis une trame `run.finished` d'identifiant `end` quand
        le run est terminé ; le serveur clôt alors le flux. Une reconnexion avec `Last-Event-ID: end` (run entièrement
