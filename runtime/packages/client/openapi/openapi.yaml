          type: [integer, 'null']
    DatasetItems:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        next_cursor:
          type: [string, 'null']
    # ——— Stratégies et statut ———
    StrategyVersionSummary:
      type: object
      required: [version, execution, network, est_cost_usd, created_by, parent_version, created_at]
      properties:
        version:
          type: integer
        execution:
          $ref: '#/components/schemas/Execution'
        network:
          $ref: '#/components/schemas/Network'
        est_cost_usd:
          type: [number, 'null']
        created_by:
