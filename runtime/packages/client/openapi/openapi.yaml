        deviceLabel:
          type: [string, 'null']
        expiresAt:
          type: [string, 'null']
          format: date-time
        sites:
          type: array
          items:
            $ref: '#/components/schemas/ConnectedSite'
    ExtensionSiteConnect:
      type: object
      additionalProperties: false
      required: [serverUseAllowed]
      properties:
        serverUseAllowed:
          type: boolean
    ExtensionSiteCookies:
      type: object
      additionalProperties: false
      required: [cookies]
      properties:
