          type: [string, 'null']
          format: date-time
        required:
          description: Vrai tant que la version courante n'est pas cochée (la console affiche alors la page).
          type: boolean
    AuditOutcome:
      type: string
      enum: [success, denied, error]
    AuditEvent:
