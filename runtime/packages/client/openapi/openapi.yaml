# Webhooks sortants (08 § 5, 16 § 6) : charges minces signées (Standard Webhooks, tâche 2.5). Le serveur les ENVOIE vers les
# cibles configurées par l'utilisateur ; ce ne sont pas des routes du serveur.
webhooks:
  run.succeeded:
    post:
      operationId: webhookRunSucceeded
      summary: Run réussi (ou dégradé)
      parameters:
        - $ref: '#/components/parameters/WebhookId'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRunSucceeded'
            example:
              type: run.succeeded
              timestamp: '2026-10-02T10:00:00.000Z'
              data: { api: books-demo-a1b2c3, api_id: 00000000-0000-0000-0000-000000000001, run_id: 00000000-0000-0000-0000-000000000002, status: sain, outcome: clean, items: 20 }
      responses:
        '2XX':
          description: Reçu (2xx en 15 s, sinon nouvelle tentative au barème).
  run.failed:
    post:
      operationId: webhookRunFailed
      summary: Run en échec
      parameters:
        - $ref: '#/components/parameters/WebhookId'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRunFailed'
      responses:
        '2XX':
          description: Reçu.
  api.status_changed:
    post:
      operationId: webhookApiStatusChanged
      summary: Changement de statut d'une API
      parameters:
        - $ref: '#/components/parameters/WebhookId'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookApiStatusChanged'
      responses:
        '2XX':
          description: Reçu.
  items.new:
    post:
      operationId: webhookItemsNew
      summary: Nouveaux items (planification avec diff)
      parameters:
        - $ref: '#/components/parameters/WebhookId'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookItemsNew'
      responses:
        '2XX':
          description: Reçu.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-sy.session
      description: Session d'interface (13 § 5) ; `sy.session` sans le préfixe `__Host-` quand PUBLIC_URL est en http (développement).
    apiKey:
      type: http
      scheme: bearer
      description: >-
        Clé d'API `sy_live_…` à scopes (13 § 8) ; jamais de scope d'administration. Une clé sans le scope qu'exige
        l'opération reçoit `403 insufficient_scope` (05 § 4.4) ; une route réservée à la session, `403 forbidden`.
    deviceToken:
      type: http
      scheme: bearer
      description: Jeton d'appareil de l'extension (07 § 1), lié à (utilisateur, appareil) ; jamais accepté hors de /api/extension.
    metricsToken:
      type: http
      scheme: bearer
      description: METRICS_TOKEN (14 § 3), distinct des clés d'API.
  parameters:
    WebhookId:
      name: webhook-id
      in: header
      required: true
      description: Identifiant de l'envoi (Standard Webhooks), stable d'une tentative à l'autre.
      schema:
        type: string
    WebhookTimestamp:
      name: webhook-timestamp
      in: header
      required: true
      description: Horodatage Unix (secondes) de l'envoi.
      schema:
        type: string
    WebhookSignature:
      name: webhook-signature
      in: header
      required: true
      description: Signature HMAC-SHA256 `v1,<base64>` de `id.timestamp.corps` (secret de la cible).
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    Cursor:
      name: cursor
      in: query
      description: Curseur opaque renvoyé par la page précédente (`next_cursor`).
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
    Wait:
      name: wait
      in: query
      description: Attente synchrone maximale en secondes (05 § 2) ; au-delà, 202 et run à suivre.
      schema:
        type: integer
        minimum: 0
        maximum: 25
  responses:
    Error:
      description: "Erreur au format commun `{ error: { code, message } }` (le code est stable, jamais localisé)."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ReauthError:
      description: >-
        Ré-authentification refusée (13 § 5) : `reauth_failed` (mot de passe actuel incorrect) ; `reauth_required`
        (compte OIDC seul dont la connexion date de plus de 10 minutes : se reconnecter chez le fournisseur
        d’identité) ; ou autre refus de l’opération (`forbidden`, `mfa_required`, `mfa_enforced`...).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Accepted:
      description: Accepté ; run (ou enquête) à suivre par `GET /api/runs/{id}` ou le flux SSE (05 § 4.3).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RunAccepted'
    QueueFull:
      description: File pleine (08b § 3) ; `queue_full` au-delà de `MAX_CONCURRENT_RUNS` runs actifs sur l'instance, `user_queue_full` au-delà de `MAX_ACTIVE_RUNS_PER_USER` pour l'appelant, `key_rate_limited` au-delà de `MAX_RUNS_PER_KEY_PER_MINUTE` créations par clé d'API ; réessayer après `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            reason:
              description: Raison stable d'un refus quand le code en a plusieurs (ex. `persistence_not_eligible`).
              type: string
            what_to_do:
              description: Marche à suivre, en anglais (05 § 1).
              type: string
    AuthError:
      description: Erreur de la bibliothèque d'authentification (format à plat, sans enveloppe `error`).
      type: object
      additionalProperties: true
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    RateLimited:
      description: 429 du serveur (`ApiError`) ou de la limite par IP de la bibliothèque (`AuthError`).
      oneOf:
        - $ref: '#/components/schemas/ApiError'
        - $ref: '#/components/schemas/AuthError'
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok
    Ready:
      type: object
      additionalProperties: false
      required: [status, initialized]
      properties:
        status:
          const: ready
        initialized:
          type: boolean
    NotReady:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          const: not_ready
        reason:
          type: string
          enum: [schema_version, database]
    Role:
      type: string
      enum: [owner, admin, member]
    Theme:
      type: string
      enum: [light, dark, system]
    Locale:
      type: string
      enum: [en, fr]
    ApiKeyScope:
      type: string
      enum: [apis:read, apis:run, apis:write, runs:read, datasets:read, schedules:write, sites:read]
    SetupRequest:
      type: object
      additionalProperties: false
      required: [token, email, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 1024
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
        displayName:
          type: string
          maxLength: 100
        instanceContact:
          type: string
          maxLength: 400
          description: "Contact de l'opérateur de l'instance (URL http(s), mailto: ou adresse électronique) ; annoncé par le robot quand identify_instance est activé (17 §5)."
    SetupResult:
      type: object
      additionalProperties: false
      required: [userId, keyFingerprint, reminder]
      properties:
        userId:
          type: string
          format: uuid
        keyFingerprint:
          type: string
        reminder:
          type: string
    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 1024
        rememberMe:
          type: boolean
    AuthUser:
      type: object
      additionalProperties: true
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
    SignInResult:
      type: object
      additionalProperties: true
      required: [user]
      properties:
        redirect:
          type: boolean
        user:
          $ref: '#/components/schemas/AuthUser'
        twoFactorRequired:
          description: Compte à 2FA (13 § 7) ; la session reste en attente du second facteur (`POST /api/auth/two-factor/verify`).
          type: boolean
        notices:
          $ref: '#/components/schemas/AccountNotices'
    SessionInfo:
      type: object
      additionalProperties: true
      required: [user]
      properties:
        session:
          type: object
          additionalProperties: true
        user:
          $ref: '#/components/schemas/AuthUser'
    Permission:
      description: Permission de la matrice des rôles (13 § 2), nom de `packages/core/src/auth/roles.ts`.
      type: string
      enum:
        - 'account:update'
        - 'account:mfa'
        - 'account:sessions'
        - 'apikeys:manage'
        - 'users:invite'
        - 'users:list'
        - 'users:deactivate'
        - 'users:delete'
        - 'users:set_role'
        - 'owner:transfer'
        - 'users:revoke_sessions'
        - 'apis:create'
        - 'apis:update'
        - 'apis:delete'
        - 'schedules:manage'
        - 'apis:read'
        - 'apis:set_visibility'
        - 'apis:run'
        - 'runs:read'
        - 'datasets:read'
        - 'runs:stats'
        - 'sites:connect'
        - 'sites:server_use'
        - 'tunnel:pair'
        - 'sites:read_cookies'
        - 'tunnel:route_other'
        - 'apikeys:read_other'
        - 'tunnel:revoke_other'
        - 'apikeys:revoke_other'
        - 'settings:llm:write'
        - 'settings:proxies:write'
        - 'settings:smtp:write'
        - 'settings:identity:write'
        - 'settings:security:write'
        - 'settings:sso:write'
        - 'audit:read'
        - 'audit:export'
        - 'audit:purge'
    Me:
      type: object
      additionalProperties: false
      required: [id, email, displayName, role, locale, theme, via, scopes, permissions, mfaEnabled, mfaRequired, mfaEnrollmentRequired]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        locale:
          type: string
          description: Langue préférée (`users.locale`) ; la console n'affiche que `en` et `fr` et retombe sur `en` sinon.
        theme:
          $ref: '#/components/schemas/Theme'
        via:
          type: string
          enum: [ui, apikey]
        scopes:
          description: Scopes de la clé d'API ; null pour une session d'interface.
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/ApiKeyScope'
            - type: 'null'
        permissions:
          description: >-
            Permissions que `can(role, …)` (13 § 2) accorde au rôle de l'appelant. La console pilote ses écrans et ses routes
            par cette liste, sans recopier la matrice ; le serveur reste seul juge à chaque requête.
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        mfaEnabled:
          description: 2FA TOTP confirmée et lisible sur le compte.
          type: boolean
        mfaRequired:
          description: >-
            MFA_ENFORCED concerne le rôle de l'appelant (13 § 7) : la 2FA ne peut pas être retirée (`DELETE /api/me/2fa` répond
            403 `mfa_enforced`), la console ne le propose pas.
          type: boolean
        mfaEnrollmentRequired:
          description: >-
            MFA_ENFORCED concerne le rôle et la 2FA n'est pas en place (ni `amr` de l'IdP) : toute route sauf l'enrôlement répond
            403 `mfa_enrollment_required` (13 § 7).
          type: boolean
    ApiKey:
      type: object
      required: [id, label, prefix, scopes, expiresAt, lastUsedAt, createdAt, revokedAt]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyScope'
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        revokedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    ApiKeyCreate:
      type: object
      additionalProperties: false
      required: [label, scopes]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ApiKeyScope'
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
        currentPassword:
          $ref: '#/components/schemas/CurrentPassword'
    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: Secret en clair, renvoyé une seule fois.
    # ——— Énumérations fermées de 04b § 1 (miroir de packages/core/src/model/enums.ts) ———
    ApiStatus:
      type: string
      enum: [enquete, sain, warning, reparation, erreur, action_requise, bloquee]
    InvestigationPhase:
      type: string
      enum: [access_check, reconnaissance, awaiting_schema_validation, testing, done]
    Visibility:
      type: string
      enum: [private, instance]
    Execution:
      description: Niveaux E1 à E6, du moins cher au plus cher (04 § 3.1).
      type: string
      enum: [fetch, fetch_in_page, playwright, agent_fetch, hybrid, agent]
    Network:
      type: string
      enum: [direct, dc_proxy, res_proxy, tunnel]
    StrategyCreator:
      type: string
      enum: [investigation, repair, user, revert, import]
    RunTrigger:
      type: string
      enum: [mcp, rest, schedule, ui, canary]
    RunState:
      type: string
      enum: [queued, running, waiting_tunnel, succeeded, failed, cancelled, skipped_tunnel_offline, skipped_window, skipped_quota, skipped_status, skipped_overlap]
    RunOutcome:
      type: string
      enum: [clean, degraded, failed]
    FailureClass:
      description: Classe d'échec fermée (04b § 1), ou famille `llm_*` (08 § 1). Code stable, jamais localisé.
      type: string
      pattern: '^(transient|network|rate_limited|forbidden|blocked_by_protection|robots_disallowed|robots_unreachable|payment_required|auth_required|account_limit|not_found|extraction|code_error|run_budget_exceeded|budget_exceeded|llm_[a-z0-9_]+)$'
    ReasonCode:
      description: >-
        Code de raison stable (06 § 4.2 : `retried`, `escalated`, `repaired`, `stale`, `reverted`, `cookie_expired`…),
        traduit par la console ; jamais une phrase.
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
    ReasonMessage:
      description: Phrase générée côté serveur, transmise en code et paramètres (traduite par la console, 06 § 4.1).
      type: object
      additionalProperties: false
      required: [code, params]
      properties:
        code:
          $ref: '#/components/schemas/ReasonCode'
        params:
          type: object
          additionalProperties:
            type: [string, number]
    EventName:
      description: >-
        Noms d'événements du flux SSE (06 § 3). Toute trame porte `id:` (reprise par `Last-Event-ID`), `event:` et
        `data:` (JSON). Le récit d'une enquête reprend les noms de `investigation_events` (3.1) ; `status.changed` vient
        aussi de `status_events` et `run.finished` de la fin d'un run. La charge porte `run_id`, `api_id` et `api_slug`.
      type: string
      enum:
        - investigation.started
        - access_report
        - phase.started
        - reconnaissance.finished
        - schema.proposed
        - schema.validated
        - attempt.finished
        - attempt.pruned
        - status.changed
        - action.required
        - investigation.finished
        - run.finished
    # ——— Objets communs ———
    Cost:
      description: Coût en dollars ; `null` quand le prix est inconnu (jamais 0 par défaut, 08 § 1).
      type: object
      additionalProperties: false
      required: [llm_usd, proxy_usd, total_usd]
      properties:
        llm_usd:
          type: [number, 'null']
        proxy_usd:
          type: [number, 'null']
        compute_usd:
          type: [number, 'null']
        total_usd:
          type: [number, 'null']
        estimated:
          type: boolean
    Tokens:
      type: object
      additionalProperties: false
      required: [in, cached, out, reasoning, estimated]
      properties:
        in:
          type: integer
        cached:
          type: integer
        out:
          type: integer
        reasoning:
          type: integer
        estimated:
          type: boolean
    Requires:
      type: object
      additionalProperties: false
      required: [session_domain, tunnel]
      properties:
        session_domain:
          type: [string, 'null']
        tunnel:
          type: boolean
    NetworkPolicy:
      description: >-
        Modes réseau autorisés pour l'API ; `res_proxy` est un opt-in explicite par API. Une API ne référence un proxy que
        par son identifiant (08 § 2). Jamais de montée réseau après un refus (X4).
      type: object
      additionalProperties: false
      required: [allow]
      properties:
        allow:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Network'
        proxy_ids:
          description: Proxy choisi par niveau, par son identifiant (à défaut, le premier proxy du type).
          type: object
          additionalProperties: false
          properties:
            dc_proxy:
              type: string
              maxLength: 64
            res_proxy:
              type: string
              maxLength: 64
        res_proxy_params:
          type: object
          additionalProperties: false
          properties:
            country:
              type: string
              pattern: '^[a-z]{2}$'
        dc_proxy_params:
          type: object
          additionalProperties: false
          properties:
            country:
              type: string
              pattern: '^[a-z]{2}$'
    AccessPolicy:
      description: '`robots` n''a qu''une valeur (INV11) : aucun réglage ne l''ignore.'
      type: object
      additionalProperties: false
      required: [robots]
      properties:
        robots:
          const: respect
        report_id:
          type: [string, 'null']
          format: uuid
        user_agent_contact:
          type: string
    DomainPacing:
      type: object
      additionalProperties: false
      properties:
        min_delay_ms:
          type: integer
          minimum: 0
        max_requests_per_run:
          type: integer
          minimum: 1
        max_wait_ms:
          type: integer
          minimum: 0
    AccessReport:
      description: Rapport d'accès, étape 0 de l'enquête (17 § 2) ; onglet « Accès » en lecture seule.
      type: object
      additionalProperties: false
      required: [id, checked_at, robots, signal]
      properties:
        id:
          type: string
          format: uuid
        checked_at:
          type: string
          format: date-time
        signal:
          description: Pastille Accès du catalogue (vert, orange, rouge).
          type: string
          enum: [allowed, review, disallowed]
        robots:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              type: string
              enum: [allowed, disallowed, absent, unreachable]
            fetched_at:
              type: [string, 'null']
              format: date-time
            rule:
              type: [string, 'null']
        usage_signals:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, value]
            properties:
              kind:
                type: string
              value:
                type: string
        llms_txt:
          type: boolean
        payment_offer:
          type: [string, 'null']
        official_api_url:
          type: [string, 'null']
    NextAction:
      type: object
      additionalProperties: false
      required: [tool, args]
      properties:
        tool:
          type: string
        args:
          type: object
          additionalProperties: true
    # ——— API (catalogue, fiche) ———
    ApiSummary:
      description: Ligne du catalogue (= élément de list_apis, plus les colonnes de 06 § 2).
      type: object
      required: [id, slug, description, status, status_reason, stale, execution, network, requires, avg_cost_usd, visibility]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        description:
          type: string
        domain:
          description: >-
            Domaine de la page enquêtée (hôte de l'URL de départ, en minuscules), affiché sous le nom dans le catalogue
            (20 § 5.2) ; null s'il n'est pas connu.
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/ApiStatus'
        status_reason:
          oneOf:
            - $ref: '#/components/schemas/ReasonMessage'
            - type: 'null'
        stale:
          type: boolean
        execution:
          oneOf:
            - $ref: '#/components/schemas/Execution'
            - type: 'null'
        network:
          oneOf:
            - $ref: '#/components/schemas/Network'
            - type: 'null'
        requires:
          $ref: '#/components/schemas/Requires'
        avg_cost_usd:
          type: [number, 'null']
        avg_cost_estimated:
          type: boolean
        last_run_at:
          type: [string, 'null']
          format: date-time
        success_rate_30d:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        access_signal:
          type: [string, 'null']
          enum: [allowed, review, disallowed, null]
        visibility:
          $ref: '#/components/schemas/Visibility'
        owner_id:
          type: string
          format: uuid
        pinned:
          type: boolean
        mcp_exposed:
          type: boolean
    ApiList:
      type: object
      additionalProperties: false
      required: [apis, next_cursor]
      properties:
        apis:
          type: array
          items:
            $ref: '#/components/schemas/ApiSummary'
        next_cursor:
          type: [string, 'null']
    ApiDetail:
      description: >-
        Fiche (= get_api, entité Api de 04b § 1). Pour l'admin face à une API avec session d'autrui, `metadata_only`
        vaut true et les schémas, l'échantillon et la stratégie sont absents (13 § 2, INV12). Un membre qui lit l'API
        `instance` d'autrui reçoit de quoi la lancer (schémas, statut, exécution, réseau autorisé, coût estimé), jamais la
        politique du propriétaire : `project_id`, `purpose`, `legal_basis`, `max_cost_usd`, `budget_daily_usd`,
        `domain_pacing`, ni les proxys et paramètres de `network_policy` (seulement `allow`).
      allOf:
        - $ref: '#/components/schemas/ApiSummary'
        - type: object
          required: [investigation_phase, current_strategy_version, metadata_only]
          properties:
            metadata_only:
              type: boolean
            project_id:
              type: string
              format: uuid
            investigation_phase:
              oneOf:
                - $ref: '#/components/schemas/InvestigationPhase'
                - type: 'null'
            input_schema:
              type: object
              additionalProperties: true
            output_schema:
              type: object
              additionalProperties: true
            views:
              type: object
              additionalProperties: false
              properties:
                columns:
                  type: array
                  items:
                    type: string
            clean_streak:
              type: integer
            last_signal_at:
              type: [string, 'null']
              format: date-time
            current_strategy_version:
              type: [integer, 'null']
            current_strategy:
              oneOf:
                - $ref: '#/components/schemas/StrategyVersionSummary'
                - type: 'null'
            network_policy:
              $ref: '#/components/schemas/NetworkPolicy'
            access_policy:
              $ref: '#/components/schemas/AccessPolicy'
            access_report:
              oneOf:
                - $ref: '#/components/schemas/AccessReport'
                - type: 'null'
            purpose:
              type: [string, 'null']
            legal_basis:
              type: [string, 'null']
            contains_personal_data:
              type: boolean
            allow_write_actions:
              type: boolean
            max_cost_usd:
              type: [number, 'null']
            budget_daily_usd:
              type: [number, 'null']
            domain_pacing:
              $ref: '#/components/schemas/DomainPacing'
            persistence:
              description: Mode « SYM ne lâche pas » (D-49) ; propriétaire seulement.
              oneOf:
                - $ref: '#/components/schemas/ApiPersistence'
                - type: 'null'
            cost_estimate:
              description: Coût estimé avant lancement (« ~0,002 $, médiane de 10 runs » ou « non estimé »).
              type: object
              additionalProperties: false
              required: [median_usd, sample_size]
              properties:
                median_usd:
                  type: [number, 'null']
                sample_size:
                  type: integer
            session_owner:
              description: Propriétaire de la session utilisée, quand ce n'est pas l'appelant (message de 06 § 2).
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [id, display_name]
                  properties:
                    id:
                      type: string
                      format: uuid
                    display_name:
                      type: string
                - type: 'null'
            recent_runs:
              type: array
              items:
                $ref: '#/components/schemas/RunSummary'
            retention_days:
              type: [integer, 'null']
            created_at:
              type: string
              format: date-time
    ApiCreate:
      description: Entrée de create_api (05 § 4.1).
      type: object
      additionalProperties: false
      required: [description, url]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 2000
        url:
          type: string
          format: uri
          maxLength: 2048
        example_output:
          description: Exemple de sortie facultatif (objet ou tableau JSON).
        auto_validate:
          type: boolean
        network_policy:
          $ref: '#/components/schemas/NetworkPolicy'
        wait_seconds:
          type: integer
          minimum: 0
          maximum: 25
        visibility:
          $ref: '#/components/schemas/Visibility'
        account_site_acknowledged:
          description: Avertissement A11 confirmé (site à compte, 06 § 2).
          type: boolean
    ApiCreated:
      type: object
      additionalProperties: false
      required: [api_id, slug, investigation_phase, proposed_output_schema, sample, access_report]
      properties:
        api_id:
          type: string
          format: uuid
        slug:
          type: string
        investigation_phase:
          oneOf:
            - $ref: '#/components/schemas/InvestigationPhase'
            - type: 'null'
        proposed_output_schema:
          type: [object, 'null']
          additionalProperties: true
        sample:
          type: array
          items:
            type: object
            additionalProperties: true
        access_report:
          oneOf:
            - $ref: '#/components/schemas/AccessReport'
            - type: 'null'
        run_id:
          type: [string, 'null']
          format: uuid
        run_state:
          description: >-
            État réel du run d'enquête à la réponse (UX-07) : en cours, ou terminé (`failed` avec `error`).
          $ref: '#/components/schemas/RunState'
        status:
          $ref: '#/components/schemas/ApiStatus'
        error:
          $ref: '#/components/schemas/RunError'
    ApiPatch:
      description: >-
        Champs modifiables. Un schéma (`output_schema`, `input_schema`) ne change que par un brouillon puis une promotion
        (19 § 6, itération) : en place, 409 `draft_required`. `access_policy` n'est pas modifiable (INV11) ; une API avec
        session reste `private` (400 `session_api_private`).
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 2000
        input_schema:
          type: object
          additionalProperties: true
        output_schema:
          type: object
          additionalProperties: true
        views:
          type: object
          additionalProperties: false
          properties:
            columns:
              type: array
              items:
                type: string
        network_policy:
          $ref: '#/components/schemas/NetworkPolicy'
        mcp_exposed:
          type: boolean
        pinned:
          type: boolean
        visibility:
          $ref: '#/components/schemas/Visibility'
        purpose:
          type: [string, 'null']
          maxLength: 2000
        legal_basis:
          type: [string, 'null']
          maxLength: 2000
        contains_personal_data:
          type: boolean
        max_cost_usd:
          description: Plafond de coût d'un run ; `null` revient au défaut de l'instance (0,5 $).
          type: [number, 'null']
          minimum: 0
        budget_daily_usd:
          description: Budget quotidien de l'API ; `null` revient au défaut de l'instance (5 $).
          type: [number, 'null']
          minimum: 0
        persistence_mode:
          description: >-
            Mode « SYM ne lâche pas » (D-49, 04 § 6), désactivé par défaut. L'activer est un acte humain : session de la
            console seulement (`403 human_confirmation_required` par une clé d'API) ; le désactiver est permis à toute clé
            du scope `apis:write`. Chaque bascule est auditée avec son acteur.
          type: boolean
        persistence_budget_usd:
          description: >-
            Plafond propre du mode, cumulé depuis l'entrée en `erreur` ; `null` revient à
            `PERSISTENCE_BUDGET_USD_DEFAULT` (jamais illimité). Le changer sur un mode actif exige la console ; un plafond
            effectif ≤ 0 répond `409 persistence_not_eligible`.
          type: [number, 'null']
          maximum: 1000
    ApiPersistence:
      description: >-
        État du mode « SYM ne lâche pas » (D-49), propriétaire seulement : interrupteur, plafond effectif (jamais
        illimité), tentatives du cycle en cours, prochain essai, dépense, tentative en cours, fin du mode et sa raison.
      type: object
      additionalProperties: false
      required: [enabled, budget_usd, attempt, next_at, spent_usd, in_progress, entered_error_at, ended, ended_reason]
      properties:
        enabled:
          type: boolean
        budget_usd:
          type: number
        attempt:
          type: integer
          minimum: 0
        next_at:
          type: [string, 'null']
          format: date-time
        spent_usd:
          type: number
        in_progress:
          type: boolean
        entered_error_at:
          type: [string, 'null']
          format: date-time
        ended:
          oneOf:
            - type: string
              enum: [refused, ineligible, exhausted]
            - type: 'null'
        ended_reason:
          type: [string, 'null']
    ApiExport:
      description: >-
        Export portable d'une API (16 § 6, tâche 3.12), format `scrapyomama.api` 1.0, clés triées. AUCUN champ pour une
        session, un cookie, une clé LLM, un identifiant de proxy, un secret ou une URL de webhook, ni pour une donnée de
        run (cibles d'alerte en référence `$ALERT_WEBHOOK_1`). Stratégie déclarative seulement (E1-E3, hors tunnel).
        `integrity.sha256` : empreinte du JSON canonique (clés triées) de l'enveloppe sans `integrity`. À l'import, les
        champs inconnus sont ignorés (contrôle complet : `parseApiExport` du cœur).
      type: object
      additionalProperties: false
      required: [format, format_version, min_runtime_version, exported_at, api, strategy, schedules, integrity]
      properties:
        format:
          const: scrapyomama.api
        format_version:
          type: string
          pattern: '^[0-9]{1,3}\.[0-9]{1,3}$'
        min_runtime_version:
          type: string
        exported_at:
          type: string
          format: date-time
        api:
          $ref: '#/components/schemas/ApiExportApi'
        strategy:
          oneOf:
            - $ref: '#/components/schemas/ApiExportStrategy'
            - type: 'null'
        history:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [version, execution, network, created_by, created_at]
            properties:
              version:
                type: integer
                minimum: 1
              execution:
                type: string
              network:
                type: string
              created_by:
                type: string
              created_at:
                type: string
        schedules:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ApiExportSchedule'
        fixtures:
          description: Enregistrements synthétiques conformes au schéma de sortie (modèles de `templates/` seulement).
          type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              maxItems: 50
              items:
                type: object
                additionalProperties: true
        integrity:
          type: object
          additionalProperties: false
          required: [sha256]
          properties:
            sha256:
              type: string
              pattern: '^[a-f0-9]{64}$'
    ApiExportApi:
      type: object
      additionalProperties: false
      required: [description, source_url, input_schema, output_schema]
      properties:
        slug:
          type: string
        description:
          type: string
          minLength: 1
          maxLength: 2000
        source_url:
          description: Page de la demande d'enquête, rejouée à l'import (rapport d'accès, robots.txt).
          type: string
          maxLength: 2048
        input_schema:
          type: object
          additionalProperties: true
        output_schema:
          type: object
          additionalProperties: true
        output_columns:
          type: array
          items:
            type: string
        views:
          type: object
          additionalProperties: false
          properties:
            columns:
              type: array
              items:
                type: string
        purpose:
          type: [string, 'null']
        legal_basis:
          type: [string, 'null']
        contains_personal_data:
          type: boolean
        max_cost_usd:
          type: number
          minimum: 0
        budget_daily_usd:
          type: number
          minimum: 0
        network_policy:
          description: Niveaux réseau exportables seulement (jamais le tunnel ni un identifiant de proxy).
          type: object
          additionalProperties: false
          required: [allow]
          properties:
            allow:
              type: array
              items:
                $ref: '#/components/schemas/Network'
        alert_targets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ref, events]
            properties:
              ref:
                type: string
                pattern: '^\$ALERT_WEBHOOK_[1-9][0-9]?$'
              events:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookEventName'
    ApiExportStrategy:
      type: object
      additionalProperties: false
      required: [execution, network, spec]
      properties:
        execution:
          type: string
          enum: [fetch, fetch_in_page, playwright]
        network:
          type: string
          enum: [direct, dc_proxy, res_proxy]
        spec:
          description: Stratégie déclarative (04b § 2), sans session ni secret.
          type: object
          additionalProperties: true
        est_cost_usd:
          type: [number, 'null']
    ApiExportSchedule:
      type: object
      additionalProperties: false
      required: [cron, timezone, input, rules, overlap, missed, enabled]
      properties:
        cron:
          type: string
        timezone:
          type: string
        input:
          type: object
          additionalProperties: true
        rules:
          type: object
          additionalProperties: true
        overlap:
          type: string
          enum: [skip, queue, allow]
        missed:
          type: string
          enum: [once, skip]
        enabled:
          type: boolean
    ApiImportPreview:
      description: Aperçu d'un import (aucune écriture) ; confirmer par `POST /api/apis/import?confirm=true`.
      type: object
      additionalProperties: false
      required: [preview, description, source_url, output_fields, personal_fields, network_allow, strategy, schedules, alert_targets, ignored_fields, requires_ack]
      properties:
        preview:
          const: true
        description:
          type: string
        source_url:
          type: string
        output_fields:
          type: array
          items:
            type: string
        personal_fields:
          description: Le schéma de sortie porte un champ `x-personal` (ou l'API se déclare à données personnelles).
          type: boolean
        network_allow:
          description: Niveaux réseau que l'API importée pourra utiliser (politique du fichier, contrôlée, jamais le tunnel ; un proxy résidentiel se voit avant la confirmation).
          type: array
          items:
            $ref: '#/components/schemas/Network'
        strategy:
          oneOf:
            - type: object
              additionalProperties: false
              required: [execution, network]
              properties:
                execution:
                  $ref: '#/components/schemas/Execution'
                network:
                  $ref: '#/components/schemas/Network'
            - type: 'null'
        schedules:
          description: Planifications recréées DÉSACTIVÉES.
          type: integer
        alert_targets:
          description: Références de cibles d'alerte à configurer (aucune n'est créée).
          type: array
          items:
            type: string
        ignored_fields:
          description: Chemins des champs inconnus ignorés (`$.api.x`) et des niveaux réseau écartés (`$.api.network_policy.allow[1]`, un `tunnel` n'étant jamais importé).
          type: array
          items:
            type: string
        requires_ack:
          description: La case « j'ai lu » (17 § 11) doit être cochée avant la confirmation.
          type: boolean
    WebhookEventName:
      type: string
      enum: [run.succeeded, run.failed, api.status_changed, items.new]
    WebhookRunSucceeded:
      description: Charge de `run.succeeded` (08 § 5) ; jamais d'item, seulement des identifiants et des compteurs.
      type: object
      required: [type, timestamp, data]
      properties:
        type:
          const: run.succeeded
        timestamp:
          type: string
          format: date-time
        data:
          type: object
          required: [api, api_id, run_id, status, outcome, items]
          properties:
            api:
              type: string
            api_id:
              type: string
              format: uuid
            run_id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/ApiStatus'
            outcome:
              type: string
            items:
              type: integer
            new_items:
              type: integer
            dataset_url:
              type: string
    WebhookRunFailed:
      description: Charge de `run.failed` ; une classe bloquante n'est jamais `retryable`.
      type: object
      required: [type, timestamp, data]
      properties:
        type:
          const: run.failed
        timestamp:
          type: string
          format: date-time
        data:
          type: object
          required: [api, api_id, run_id, status, failure_class, retryable]
          properties:
            api:
              type: string
            api_id:
              type: string
              format: uuid
            run_id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/ApiStatus'
            failure_class:
              oneOf:
                - $ref: '#/components/schemas/FailureClass'
                - type: 'null'
            retryable:
              type: [boolean, 'null']
    WebhookApiStatusChanged:
      description: Charge de `api.status_changed` ; vers `bloquee`, `retryable` vaut false.
      type: object
      required: [type, timestamp, data]
      properties:
        type:
          const: api.status_changed
        timestamp:
          type: string
          format: date-time
        data:
          type: object
          required: [api, api_id, from, to, reason, retryable]
          properties:
            api:
              type: string
            api_id:
              type: string
              format: uuid
            from:
              oneOf:
                - $ref: '#/components/schemas/ApiStatus'
                - type: 'null'
            to:
              $ref: '#/components/schemas/ApiStatus'
            reason:
              type: [string, 'null']
            run_id:
              type: string
              format: uuid
            retryable:
              type: boolean
    WebhookItemsNew:
      description: Charge de `items.new`.
      type: object
      required: [type, timestamp, data]
      properties:
        type:
          const: items.new
        timestamp:
          type: string
          format: date-time
        data:
          type: object
          required: [api, api_id, run_id, new_items, items]
          properties:
            api:
              type: string
            api_id:
              type: string
              format: uuid
            run_id:
              type: string
              format: uuid
            new_items:
              type: integer
            items:
              type: integer
            dataset_url:
              type: string
    ValidateSchemaRequest:
      type: object
      additionalProperties: false
      properties:
        output_schema:
          type: object
          additionalProperties: true
        exclude_executions:
          description: Plan d'essais restreint avant exécution (06 § 2, tâche 3.5), dans les bornes de la politique réseau ; jamais d'ajout.
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Execution'
        wait_seconds:
          type: integer
          minimum: 0
          maximum: 25
    InvestigateRequest:
      type: object
      additionalProperties: false
      properties:
        exclude_executions:
          description: Plan d'essais restreint avant exécution (06 § 2), dans les bornes de la politique réseau.
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Execution'
    # ——— Runs ———
    RunRequest:
      description: Entrée de run_api (05 § 4.1), validée contre `input_schema` (400 `invalid_input`, aucun run créé).
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input:
          type: object
          additionalProperties: true
        force_investigate:
          type: boolean
        strategy_version:
          description: >-
            Relance avec une version précise (06 § 2) : une version qui a été courante (la courante, l'origine), sinon
            `400 invalid_strategy_version` ; réservé au propriétaire de l'API (`403 forbidden` pour un membre).
          type: integer
          minimum: 1
          maximum: 2147483647
    RunAccepted:
      type: object
      additionalProperties: false
      required: [run_id, state]
      properties:
        run_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/RunState'
        poll_after_seconds:
          type: [integer, 'null']
    RunError:
      description: >-
        Cause nommée d'un run arrêté ou en échec (UX-04) : code stable (`instance_contact_missing`…), message lisible, marche à
        suivre pour l'agent (en anglais) et `retryable`. Absente quand la cause n'est pas nommée.
      type: object
      additionalProperties: false
      required: [code, message, what_to_do, retryable]
      properties:
        code:
          $ref: '#/components/schemas/ReasonCode'
        message:
          type: string
        what_to_do:
          type: string
        retryable:
          type: boolean
    RunResult:
      description: Enveloppe commune des sorties d'exécution (05 § 4.1), identique en MCP et en REST.
      type: object
      additionalProperties: false
      required: [run_id, state, status, items, total, dataset_id, truncated, next_cursor, degraded_reasons, message, next_action, poll_after_seconds, timeline, cost, console_url]
      properties:
        run_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/RunState'
        status:
          $ref: '#/components/schemas/ApiStatus'
        items:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: true
        total:
          type: [integer, 'null']
        dataset_id:
          type: [string, 'null']
          format: uuid
        truncated:
          type: boolean
        next_cursor:
          type: [string, 'null']
        degraded_reasons:
          type: array
          items:
            $ref: '#/components/schemas/ReasonCode'
        message:
          type: string
        error:
          $ref: '#/components/schemas/RunError'
        next_action:
          oneOf:
            - $ref: '#/components/schemas/NextAction'
            - type: 'null'
        poll_after_seconds:
          type: [integer, 'null']
        timeline:
          type: array
          items:
            type: object
            additionalProperties: true
        cost:
          $ref: '#/components/schemas/Cost'
        console_url:
          type: string
    RunCancelled:
      type: object
      additionalProperties: false
      required: [run_id, state, cost]
      properties:
        run_id:
          type: string
          format: uuid
        state:
          const: cancelled
        cost:
          $ref: '#/components/schemas/Cost'
    RunSummary:
      description: 'Métadonnées d''un run (état, coût, durée, nombre d''items) : seule vue de l''admin sur les runs d''autrui.'
      type: object
      required: [id, api_id, api_slug, owner_id, trigger, state, outcome, degraded_reasons, failure_class, created_at, started_at, finished_at, duration_ms, cost, items]
      properties:
        id:
          type: string
          format: uuid
        api_id:
          type: string
          format: uuid
        api_slug:
          type: string
        owner_id:
          type: string
          format: uuid
        strategy_version:
          type: [integer, 'null']
        trigger:
          $ref: '#/components/schemas/RunTrigger'
        state:
          $ref: '#/components/schemas/RunState'
        outcome:
          oneOf:
            - $ref: '#/components/schemas/RunOutcome'
            - type: 'null'
        degraded_reasons:
          type: array
          items:
            $ref: '#/components/schemas/ReasonCode'
        failure_class:
          oneOf:
            - $ref: '#/components/schemas/FailureClass'
            - type: 'null'
        retryable:
          type: boolean
        error:
          $ref: '#/components/schemas/RunError'
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
        duration_ms:
          type: [integer, 'null']
        cost:
          $ref: '#/components/schemas/Cost'
        items:
          type: [integer, 'null']
        dataset_id:
          type: [string, 'null']
          format: uuid
        retention_until:
          type: [string, 'null']
          format: date-time
    RunList:
      type: object
      additionalProperties: false
      required: [runs, next_cursor]
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        next_cursor:
          type: [string, 'null']
    RunAttempt:
      description: Un essai de la cascade (exécution × réseau × résultat × coût) ; un essai élagué n'a pas été lancé (INV2).
      type: object
      additionalProperties: false
      required: [index, execution, network, state, est_cost_usd, result, cost_usd, ms]
      properties:
        index:
          type: integer
        execution:
          $ref: '#/components/schemas/Execution'
        network:
          $ref: '#/components/schemas/Network'
        state:
          type: string
          enum: [running, done, pruned]
        pruned_reason:
          type: [string, 'null']
        est_cost_usd:
          type: [number, 'null']
        result:
          description: '`ok`, ou la classe d''échec de l''essai.'
          type: [string, 'null']
        cost_usd:
          type: [number, 'null']
        ms:
          type: [integer, 'null']
        model_id:
          type: [string, 'null']
        prompt_version:
          type: [string, 'null']
        engine:
          type: [string, 'null']
        tokens:
          $ref: '#/components/schemas/Tokens'
        error:
          description: Onglet Erreur (Où, Quoi, Pourquoi, Que faire) en codes stables ; absent pour l'admin sur un run d'autrui.
          oneOf:
            - $ref: '#/components/schemas/ReasonMessage'
            - type: 'null'
    Run:
      description: Détail d'un run (entité Run de 04b § 1) ; `metadata_only` pour l'admin face au run avec session d'autrui.
      allOf:
        - $ref: '#/components/schemas/RunSummary'
        - type: object
          required: [metadata_only, attempts, tokens]
          properties:
            metadata_only:
              type: boolean
            attempts:
              type: array
              items:
                $ref: '#/components/schemas/RunAttempt'
            tokens:
              $ref: '#/components/schemas/Tokens'
            trace_id:
              type: [string, 'null']
            paused_at:
              # Extension de 05 § 4.2 (tâche 3.5, à livrer par 3.1 avec POST /api/runs/{id}/pause) : la console relit la pause
              # à la réouverture d'une enquête, au lieu de la garder seulement en mémoire.
              description: Date de la pause demandée par l'utilisateur (`POST /api/runs/{id}/pause`) ; null hors pause, remis à null par `resume`.
              type: [string, 'null']
              format: date-time
            input:
              description: Entrée du run ; absente pour l'admin sur un run d'autrui.
              type: object
              additionalProperties: true
            quality:
              description: >-
                Fiche de qualité du run (tâche 2.12, 19 § 3) : profil calculé par le code après la garde de classification et
                Ajv ; un champ `x-personal` n'a que des formes. Absente pour l'admin sur un run d'autrui.
              oneOf:
                - $ref: '#/components/schemas/RunQuality'
                - type: 'null'
            judge:
              description: Avis CONSULTATIF du juge (19 § 3) ; il ne change jamais le statut ni la version.
              oneOf:
                - $ref: '#/components/schemas/RunJudge'
                - type: 'null'
    RunQuality:
      type: object
