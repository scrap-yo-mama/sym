                minLength: 1
              value:
                type: string
              domain:
                type: string
                minLength: 1
                maxLength: 253
              path:
                type: string
                minLength: 1
                maxLength: 1024
              secure:
                type: boolean
              httpOnly:
                type: boolean
              sameSite:
                type: string
                enum: [no_restriction, lax, strict, unspecified]
              expirationDate:
                type: number
                minimum: 0
    ExtensionDevice:
      type: object
      additionalProperties: false
      required: [id, deviceLabel, createdAt, lastSeenAt, expiresAt, revokedAt]
      properties:
        id:
          type: string
          format: uuid
        deviceLabel:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
    ExtensionDeviceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExtensionDevice'
    AdminExtensionDevice:
      allOf:
        - $ref: '#/components/schemas/ExtensionDevice'
        - type: object
          required: [ownerId, ownerEmail]
          properties:
            ownerId:
              type: string
              format: uuid
            ownerEmail:
              type: string
    AdminExtensionDeviceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminExtensionDevice'
