    get:
      operationId: getDatasetItems
      tags: [datasets]
      summary: Items d'un dataset, exportés en flux (JSON, NDJSON, CSV à cellules neutralisées), curseur `after`
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: format
          in: query
          description: CSV à cellules neutralisées (08b § 2) ; colonnes = propriétés du schéma de sortie dans leur ordre déclaré (ou `fields`). Un champ d'item hors des propriétés du schéma n'a pas de colonne CSV ; il reste dans JSON et NDJSON, ou se nomme par `fields`.
          schema:
            type: string
            enum: [json, ndjson, csv]
            default: json
        - name: after
          in: query
          description: >-
            Curseur opaque du dernier item servi (`next_cursor`, ou en-tête `X-Next-Cursor`), ou `seq` en clair du dernier
            item reçu (rang dans le dataset, 0 pour le premier).
          schema:
            type: string
        - name: offset
          in: query
          description: >-
            Reprise d'un export coupé en cours de route : nombre d'items déjà reçus EN ENTIER (lignes NDJSON complètes,
            lignes CSV hors en-tête), avec les mêmes filtres ; l'export reprend à l'item suivant, sans doublon ni perte.
          schema:
            type: integer
            minimum: 0
            maximum: 1000000000
        - name: limit
          in: query
          description: Nombre maximal d'items ; absent, l'export va jusqu'au bout du dataset, en flux.
          schema:
            type: integer
            minimum: 1
            maximum: 100000
        - name: fields
          in: query
          description: Champs à garder, séparés par des virgules.
          schema:
            type: string
        - name: omit
          in: query
          description: Champs à retirer, séparés par des virgules.
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: >-
            Items, écrits en flux (mémoire bornée) ; pièce jointe avec `nosniff` pour un export. CSV : cellules qui
            commencent par =, +, -, @, tabulation ou retour chariot préfixées d'une apostrophe (08b § 2).
          headers:
            X-Next-Cursor:
              description: Curseur de la suite quand `limit` arrête la page avant la fin du dataset.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetItems'
            application/x-ndjson:
              schema:
                type: string
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
