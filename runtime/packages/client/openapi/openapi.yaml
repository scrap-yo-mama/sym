      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        mfa_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: [string, 'null']
          format: date-time
        disabled_at:
          type: [string, 'null']
          format: date-time
    UserList:
      type: object
      additionalProperties: false
      required: [users, next_cursor]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        next_cursor:
          type: [string, 'null']
    UserPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role:
          type: string
          enum: [member, admin]
        status:
          type: string
          enum: [active, disabled]
    OneTimeLink:
      type: object
      additionalProperties: false
      required: [link, expires_at]
      properties:
        link:
          type: string
        expires_at:
          type: string
          format: date-time
    OwnerTransferRequest:
      type: object
      additionalProperties: false
      required: [to_user_id, totp_code]
      properties:
        to_user_id:
          type: string
          format: uuid
        current_password:
          $ref: '#/components/schemas/CurrentPassword'
        totp_code:
          type: string
          pattern: '^\d{6}$'
    Invitation:
      type: object
      required: [id, email, role, invited_by, expires_at, created_at, accepted_at, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [member, admin]
        invited_by:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        accepted_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
    InvitationList:
      type: object
      additionalProperties: false
      required: [invitations]
      properties:
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
    InvitationCreate:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          maxLength: 254
        role:
          description: '`admin` seulement si l''invitant est l''owner.'
          type: string
          enum: [member, admin]
    InvitationCreated:
      allOf:
        - $ref: '#/components/schemas/Invitation'
        - type: object
          required: [emailed, link]
          properties:
            emailed:
              type: boolean
            link:
              description: Lien copiable, affiché une fois, seulement sans SMTP ; null si envoyé par e-mail.
              type: [string, 'null']
    InvitationAccept:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 1024
        password:
          type: string
          minLength: 1
          maxLength: 1024
        display_name:
          type: string
          maxLength: 100
    AuthSession:
      type: object
      additionalProperties: false
      required: [id, created_at, last_seen_at, expires_at, current]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: string
          format: date-time
        ip:
          type: [string, 'null']
        user_agent:
          type: [string, 'null']
        current:
          type: boolean
    AuthSessionList:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AuthSession'
    CurrentPassword:
      description: >-
        Mot de passe actuel (ré-authentification, 13 § 5, ASVS 7.5.1). Compte à mot de passe local : exigé
        (absent → 400 `current_password_required` ; faux → 403 `reauth_failed` ; 5 échecs sur 15 min, toutes
        opérations sensibles confondues → 429 `too_many_attempts` et session fermée). Compte sans mot de passe local
        (OIDC seul) : facultatif et ignoré, une connexion de moins de 10 minutes fait foi (sinon 403 `reauth_required` :
        se reconnecter chez le fournisseur d’identité, sans échec compté).
      type: string
      minLength: 1
      maxLength: 1024
    PasswordConfirmation:
      description: Ré-authentification (session récente exigée).
      type: object
      additionalProperties: false
      properties:
        current_password:
          $ref: '#/components/schemas/CurrentPassword'
    SecondFactorCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          description: Code TOTP (6 chiffres) ou code de secours.
          type: string
          minLength: 1
          maxLength: 32
    SecondFactorResult:
      type: object
      additionalProperties: false
      required: [ok, method]
      properties:
        ok:
          type: boolean
        method:
          type: string
          enum: [totp, backup_code]
        backup_codes_remaining:
          type: integer
          minimum: 0
        notices:
          $ref: '#/components/schemas/AccountNotices'
    AccountNotices:
      description: Signalements au titulaire, montrés une fois après une authentification complète (ex. `password_reset_by_operator` - lien émis par la commande serveur, 13 § 4 ; `password_reset_withheld` - lien par e-mail retenu, relais SMTP réglé par un admin depuis moins de 24 h et compte sans 2FA).
      type: array
      items:
        type: object
        additionalProperties: false
        required: [code, at]
        properties:
          code:
            type: string
          at:
            type: string
            format: date-time
    PasswordChange:
      description: Changement du mot de passe depuis Mon compte (ré-authentification par le mot de passe actuel).
      type: object
      additionalProperties: false
      required: [new_password]
      properties:
        current_password:
          $ref: '#/components/schemas/CurrentPassword'
        new_password:
          type: string
          minLength: 1
          maxLength: 1024
    PasswordChanged:
      type: object
      additionalProperties: false
      required: [other_sessions]
      properties:
        other_sessions:
          description: Autres sessions d'interface ouvertes du compte, restées ouvertes ; la console propose de les fermer.
          type: integer
          minimum: 0
    PasswordAndCode:
      description: Ré-authentification et second facteur (code TOTP ou code de secours), limité par compte.
      type: object
      additionalProperties: false
      required: [code]
      properties:
        current_password:
          $ref: '#/components/schemas/CurrentPassword'
        code:
          type: string
          minLength: 1
          maxLength: 32
    OidcLinkRequest:
      description: Ré-authentification avant liaison ; `code` exigé si le compte a une 2FA.
      type: object
      additionalProperties: false
      properties:
        current_password:
          $ref: '#/components/schemas/CurrentPassword'
        code:
          type: string
          minLength: 1
          maxLength: 32
    OidcLinkStart:
      type: object
      additionalProperties: false
      required: [authorization_url]
      properties:
        authorization_url:
          type: string
          format: uri
    LinkedIdentity:
      type: object
      additionalProperties: false
      required: [id, provider, issuer, created_at]
      properties:
        id:
          type: string
          format: uuid
        provider:
          description: 'Fournisseur, sous la forme `oidc:<slug>`.'
          type: string
        issuer:
          type: string
        created_at:
          type: [string, 'null']
          format: date-time
    LinkedIdentityList:
      type: object
      additionalProperties: false
      required: [identities]
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/LinkedIdentity'
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
    PasswordReset:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 1024
        code:
          description: Code TOTP ou code de secours, exigé si le compte a une 2FA.
          type: string
          maxLength: 32
    TotpCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: '^\d{6}$'
    TwoFactorEnrollment:
      type: object
      additionalProperties: false
      required: [otpauth_uri, secret]
      properties:
        otpauth_uri:
          type: string
        secret:
          description: Graine base32, affichée une seule fois pendant l'enrôlement.
          type: string
    BackupCodes:
      type: object
      additionalProperties: false
      required: [backup_codes]
      properties:
        backup_codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
