        attempt:
          type: [integer, 'null']
        data:
          type: object
          additionalProperties: true
    RunLogList:
      type: object
      additionalProperties: false
      required: [lines, next_after]
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/RunLogLine'
