          type: string
        at:
          type: string
          format: date-time
        actor_user_id:
          type: [string, 'null']
          format: uuid
        actor_via:
          type: string
          enum: [ui, apikey, mcp, sso, system]
        actor_ref:
          type: [string, 'null']
        action:
          type: string
        target_type:
          type: [string, 'null']
        target_id:
          type: [string, 'null']
        outcome:
          $ref: '#/components/schemas/AuditOutcome'
        ip:
          type: [string, 'null']
        user_agent:
          type: [string, 'null']
        meta:
          type: object
          additionalProperties: true
    AuditEventList:
      type: object
      additionalProperties: false
      required: [events, next_cursor]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: [string, 'null']
    # ——— RGPD (17 § 6) et tunnel (07 § 1) ———
    SubjectRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          description: Identifiant de la personne (e-mail, téléphone, identifiant de plateforme).
          type: string
          minLength: 1
          maxLength: 512
        kind:
          type: string
          enum: [email, phone, other]
        scope:
          description: >-
            `own` : les données de l'appelant (contenu compris) ; `instance` : toute l'instance, réservé à l'admin et à
            l'owner, qui n'obtiennent que des métadonnées et les valeurs identifiantes (INV5). Défaut : `instance` pour
            l'admin, `own` pour un membre.
          type: string
          enum: [own, instance]
    SubjectEraseRequest:
      allOf:
        - $ref: '#/components/schemas/SubjectRequest'
        - type: object
          required: [dry_run]
          properties:
            dry_run:
              type: boolean
            confirmation:
              description: Empreinte rendue par l'aperçu (`dry_run` à true), exigée pour effacer (sinon 409 `confirmation_required`).
              type: string
              maxLength: 128
    SubjectEraseResult:
      type: object
      additionalProperties: false
      required: [dry_run, counts, excluded]
      properties:
        dry_run:
          type: boolean
        counts:
          description: Occurrences par table (aperçu) ou supprimées.
          type: object
          additionalProperties:
            type: integer
        excluded:
          description: Ajoutée à la liste d'exclusion hachée (faux en aperçu).
          type: boolean
        confirmation:
          description: Aperçu seulement - empreinte du plan, à renvoyer pour effacer.
          type: string
    SubjectExport:
      description: >-
        Ce que l'instance détient sur la personne dans la portée (1.8, D-26) : items, runs, journaux, événements d'enquête,
        artefacts. Contenu rendu au seul propriétaire des données (`content: true`), métadonnées sinon.
      type: object
      additionalProperties: true
      required: [identifier, generated_at, scope, content, subject_hashes, excluded, dataset_items, runs, run_logs, investigation_events, run_artifacts]
      properties:
        identifier:
          type: string
        generated_at:
          type: string
          format: date-time
        scope:
          type: string
          enum: [owner, instance]
        content:
          type: boolean
        subject_hashes:
          type: array
          items:
            type: string
        excluded:
          type: boolean
        dataset_items:
          type: array
          items:
            type: object
            additionalProperties: true
        runs:
          type: array
          items:
            type: object
            additionalProperties: true
        run_logs:
          type: array
          items:
            type: object
            additionalProperties: true
        investigation_events:
          type: array
          items:
            type: object
            additionalProperties: true
        run_artifacts:
          type: array
          items:
            type: object
            additionalProperties: true
    PairingCode:
      type: object
      additionalProperties: false
      required: [code, expires_at]
      properties:
        code:
