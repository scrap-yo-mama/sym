      description: Ré-authentification (session récente exigée).
      type: object
      additionalProperties: false
      properties:
        current_password:
          $ref: '#/components/schemas/CurrentPassword'
    SecondFactorCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          description: Code TOTP (6 chiffres) ou code de secours.
          type: string
          minLength: 1
          maxLength: 32
    SecondFactorResult:
      type: object
      additionalProperties: false
      required: [ok, method]
      properties:
        ok:
          type: boolean
        method:
          type: string
          enum: [totp, backup_code]
        backup_codes_remaining:
          type: integer
          minimum: 0
        notices:
          $ref: '#/components/schemas/AccountNotices'
    AccountNotices:
      description: Signalements au titulaire, montrés une fois après une authentification complète (ex. `password_reset_by_operator` - lien émis par la commande serveur, 13 § 4 ; `password_reset_withheld` - lien par e-mail retenu, relais SMTP réglé par un admin depuis moins de 24 h et compte sans 2FA).
      type: array
      items:
        type: object
        additionalProperties: false
        required: [code, at]
        properties:
          code:
            type: string
          at:
            type: string
            format: date-time
    PasswordChange:
      description: Changement du mot de passe depuis Mon compte (ré-authentification par le mot de passe actuel).
      type: object
      additionalProperties: false
      required: [new_password]
      properties:
        current_password:
          $ref: '#/components/schemas/CurrentPassword'
        new_password:
          type: string
          minLength: 1
          maxLength: 1024
    PasswordChanged:
      type: object
      additionalProperties: false
      required: [other_sessions]
      properties:
        other_sessions:
          description: Autres sessions d'interface ouvertes du compte, restées ouvertes ; la console propose de les fermer.
          type: integer
          minimum: 0
    PasswordAndCode:
      description: Ré-authentification et second facteur (code TOTP ou code de secours), limité par compte.
      type: object
      additionalProperties: false
      required: [code]
      properties:
        current_password:
          $ref: '#/components/schemas/CurrentPassword'
        code:
          type: string
          minLength: 1
          maxLength: 32
    OidcLinkRequest:
      description: Ré-authentification avant liaison ; `code` exigé si le compte a une 2FA.
      type: object
      additionalProperties: false
      properties:
        current_password:
          $ref: '#/components/schemas/CurrentPassword'
        code:
          type: string
          minLength: 1
          maxLength: 32
    OidcLinkStart:
      type: object
      additionalProperties: false
      required: [authorization_url]
      properties:
        authorization_url:
          type: string
          format: uri
    LinkedIdentity:
      type: object
      additionalProperties: false
      required: [id, provider, issuer, created_at]
      properties:
        id:
          type: string
          format: uuid
        provider:
          description: 'Fournisseur, sous la forme `oidc:<slug>`.'
          type: string
        issuer:
          type: string
        created_at:
          type: [string, 'null']
          format: date-time
    LinkedIdentityList:
      type: object
      additionalProperties: false
      required: [identities]
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/LinkedIdentity'
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
    PasswordReset:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 1024
        code:
          description: Code TOTP ou code de secours, exigé si le compte a une 2FA.
          type: string
          maxLength: 32
    TotpCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: '^\d{6}$'
    TwoFactorEnrollment:
      type: object
      additionalProperties: false
      required: [otpauth_uri, secret]
      properties:
        otpauth_uri:
          type: string
        secret:
          description: Graine base32, affichée une seule fois pendant l'enrôlement.
          type: string
    BackupCodes:
      type: object
      additionalProperties: false
      required: [backup_codes]
      properties:
        backup_codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
    TwoFactorDisable:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        current_password:
          $ref: '#/components/schemas/CurrentPassword'
        code:
          description: Code TOTP ou code de secours.
          type: string
          maxLength: 32
    AuditOutcome:
      type: string
      enum: [success, denied, error]
    AuditEvent:
      description: Événement d'audit ; `meta` ne contient ni secret, ni cookie, ni contenu, ni argument d'outil.
      type: object
      additionalProperties: false
      required: [id, at, actor_user_id, actor_via, action, target_type, target_id, outcome, meta]
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        actor_user_id:
          type: [string, 'null']
          format: uuid
        actor_via:
          type: string
          enum: [ui, apikey, mcp, sso, system]
        actor_ref:
          type: [string, 'null']
        action:
          type: string
        target_type:
          type: [string, 'null']
        target_id:
          type: [string, 'null']
        outcome:
          $ref: '#/components/schemas/AuditOutcome'
        ip:
          type: [string, 'null']
        user_agent:
          type: [string, 'null']
        meta:
          type: object
          additionalProperties: true
    AuditEventList:
      type: object
      additionalProperties: false
      required: [events, next_cursor]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: [string, 'null']
    # ——— RGPD (17 § 6) et tunnel (07 § 1) ———
    SubjectRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          description: Identifiant de la personne (e-mail, téléphone, identifiant de plateforme).
          type: string
          minLength: 1
          maxLength: 512
        kind:
          type: string
          enum: [email, phone, other]
    SubjectEraseRequest:
      allOf:
        - $ref: '#/components/schemas/SubjectRequest'
        - type: object
          required: [dry_run]
          properties:
            dry_run:
              type: boolean
    SubjectEraseResult:
      type: object
      additionalProperties: false
      required: [dry_run, counts, excluded]
      properties:
        dry_run:
          type: boolean
        counts:
          description: Occurrences par table (aperçu) ou supprimées.
          type: object
          additionalProperties:
            type: integer
        excluded:
          description: Ajoutée à la liste d'exclusion hachée (faux en aperçu).
          type: boolean
    SubjectExport:
      type: object
      additionalProperties: false
      required: [identifier, occurrences]
      properties:
        identifier:
          type: string
        occurrences:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [dataset_id, api_slug, item]
            properties:
              dataset_id:
                type: string
                format: uuid
              api_slug:
                type: string
              item:
                type: object
                additionalProperties: true
    PairingCode:
      type: object
      additionalProperties: false
      required: [code, expires_at]
      properties:
        code:
          description: Code à usage unique, valable 10 minutes.
          type: string
        expires_at:
          type: string
          format: date-time
    # ——— Extension livrée par 2.6 (camelCase comme le code livré) ———
    ExtensionPairingCodeRequest:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          $ref: '#/components/schemas/CurrentPassword'
    ExtensionPairingCode:
      type: object
      additionalProperties: false
      required: [code, expiresAt]
      properties:
        code:
          description: Code à usage unique, valable 10 minutes.
          type: string
        expiresAt:
          type: string
          format: date-time
    ExtensionPairRequest:
      type: object
      additionalProperties: false
      required: [code, deviceId]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
        deviceId:
          type: string
          pattern: '^[A-Za-z0-9_-]{8,64}$'
        deviceLabel:
          type: string
          minLength: 1
          maxLength: 100
    ExtensionPaired:
      type: object
      additionalProperties: false
      required: [token, expiresAt, email, deviceLabel]
      properties:
        token:
          description: Jeton d'appareil, jamais ré-affiché.
          type: string
        expiresAt:
          type: string
          format: date-time
        email:
          type: string
        deviceLabel:
          type: [string, 'null']
    ConnectedSite:
      type: object
      additionalProperties: false
      required: [id, domain, serverUseAllowed, hasServerCookies, consentedAt, capturedAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        domain:
          type: string
        serverUseAllowed:
          description: Faux = mode tunnel (les cookies restent dans le navigateur).
          type: boolean
        hasServerCookies:
          type: boolean
        consentedAt:
          type: string
          format: date-time
        capturedAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
    ConnectedSiteList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConnectedSite'
    ExtensionSession:
      type: object
      additionalProperties: false
      required: [email, deviceLabel, expiresAt, sites]
      properties:
        email:
          type: string
        deviceLabel:
          type: [string, 'null']
        expiresAt:
          type: [string, 'null']
          format: date-time
        sites:
          type: array
          items:
            $ref: '#/components/schemas/ConnectedSite'
    ExtensionSiteConnect:
      type: object
      additionalProperties: false
      required: [serverUseAllowed]
      properties:
        serverUseAllowed:
          type: boolean
    ExtensionSiteCookies:
      type: object
      additionalProperties: false
      required: [cookies]
      properties:
        cookies:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, value, domain, path, secure, httpOnly]
            properties:
              name:
                type: string
                minLength: 1
              value:
                type: string
              domain:
                type: string
                minLength: 1
                maxLength: 253
              path:
                type: string
                minLength: 1
                maxLength: 1024
              secure:
                type: boolean
              httpOnly:
                type: boolean
              sameSite:
                type: string
                enum: [no_restriction, lax, strict, unspecified]
              expirationDate:
                type: number
                minimum: 0
    ExtensionDevice:
      type: object
      additionalProperties: false
      required: [id, deviceLabel, createdAt, lastSeenAt, expiresAt, revokedAt]
      properties:
        id:
          type: string
          format: uuid
        deviceLabel:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
    ExtensionDeviceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExtensionDevice'
    AdminExtensionDevice:
      allOf:
        - $ref: '#/components/schemas/ExtensionDevice'
        - type: object
          required: [ownerId, ownerEmail]
          properties:
            ownerId:
              type: string
              format: uuid
            ownerEmail:
              type: string
    AdminExtensionDeviceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminExtensionDevice'
    # ——— Système ———
    Version:
      type: object
      additionalProperties: false
      required: [server, schema, min_extension, mcp_spec]
      properties:
        server:
          type: string
          description: Version de l'instance (SemVer, `RUNTIME_VERSION`).
        schema:
          type: integer
          description: Version attendue du schéma de base.
        min_extension:
          type: string
          description: Version minimale de l'extension acceptée à l'appairage.
        mcp_spec:
          type: string
          description: Version de la spécification MCP servie.
    ProtectedResourceMetadata:
      description: RFC 9728.
      type: object
      additionalProperties: true
      required: [resource]
      properties:
        resource:
          type: string
        authorization_servers:
          type: array
          items:
            type: string
        bearer_methods_supported:
          type: array
          items:
            type: string
        scopes_supported:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyScope'
