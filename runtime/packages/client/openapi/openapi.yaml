        - $ref: '#/components/parameters/Id'
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        '204':
          description: >-
            Run terminé et entièrement servi (`Last-Event-ID: end`) ; rien à rejouer, ne pas se reconnecter.
