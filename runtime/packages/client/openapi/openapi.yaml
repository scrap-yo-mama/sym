          type: boolean
        consentedAt:
          type: string
          format: date-time
        capturedAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
    ConnectedSiteList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConnectedSite'
    ExtensionSession:
      type: object
      additionalProperties: false
