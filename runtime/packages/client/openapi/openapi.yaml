          type: [string, 'null']
          format: uuid
    StrategyVersion:
      allOf:
        - $ref: '#/components/schemas/StrategyVersionSummary'
        - type: object
          required: [spec, script_ref]
          properties:
            spec:
              description: Stratégie déclarative (04b § 2), ou null si la version est un script.
              type: [object, 'null']
              additionalProperties: true
            script_ref:
              type: [string, 'null']
            patch:
              description: Patch RFC 6902 (version produite par une réparation).
              type: [array, 'null']
              items:
                type: object
                additionalProperties: true
    ResolvedRules:
      description: Ensemble résolu des règles et skills d'une API (19 § 2) ; noms, versions, empreintes et jetons, jamais le contenu.
      type: object
      additionalProperties: false
      required: [role, budget_tokens, tokens, rules, skills, truncated, skills_listing_truncated, skills_tokens]
      properties:
        role:
          type: string
          enum: [investigate, repair, embedded]
        budget_tokens:
          type: integer
        tokens:
          type: integer
        rules:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, version, level, tokens, sha256]
            properties:
              name: { type: string }
              version: { type: integer }
              level: { type: string, enum: [instance, domain, api] }
              tokens: { type: integer }
              sha256: { type: string }
        skills:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, version, description, sha256]
            properties:
              name: { type: string }
              version: { type: integer }
              description: { type: [string, 'null'] }
              sha256: { type: string }
        truncated:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, version, level, tokens]
            properties:
              name: { type: string }
              version: { type: integer }
              level: { type: string, enum: [instance, domain, api] }
              tokens: { type: integer }
        skills_listing_truncated:
          type: boolean
        skills_tokens:
          type: integer
    StrategyVersionList:
      type: object
      additionalProperties: false
      required: [versions, next_cursor]
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/StrategyVersionSummary'
        next_cursor:
          type: [string, 'null']
    StrategyDiff:
      description: Diff à trois niveaux (06 § 2) ; la phrase est un code de raison avec ses paramètres.
      type: object
      additionalProperties: false
      required: [from, to, summary, fields, raw]
      properties:
        from:
          type: integer
        to:
          type: integer
        summary:
          $ref: '#/components/schemas/ReasonMessage'
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, change]
            properties:
              path:
                type: string
              change:
                type: string
                enum: [added, removed, changed]
              before: {}
              after: {}
        raw:
          type: object
          additionalProperties: false
          required: [before, after]
          properties:
            before:
              type: [object, 'null']
              additionalProperties: true
            after:
              type: [object, 'null']
              additionalProperties: true
    StatusEvent:
      type: object
      additionalProperties: false
      required: [id, at, from_status, to_status, reason, run_id]
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        from_status:
          oneOf:
            - $ref: '#/components/schemas/ApiStatus'
            - type: 'null'
        to_status:
          $ref: '#/components/schemas/ApiStatus'
        transition:
          type: [integer, 'null']
        reason:
          oneOf:
            - $ref: '#/components/schemas/ReasonMessage'
            - type: 'null'
        failure_class:
          oneOf:
            - $ref: '#/components/schemas/FailureClass'
            - type: 'null'
        run_id:
          type: [string, 'null']
          format: uuid
    StatusEventList:
      type: object
      additionalProperties: false
      required: [events, next_cursor]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/StatusEvent'
        next_cursor:
          type: [string, 'null']
    # ——— Planifications (08 § 5) ———
    ScheduleRules:
      type: object
      additionalProperties: false
      properties:
        only_if_tunnel_online:
          type: boolean
        window:
          type: [object, 'null']
          additionalProperties: false
          required: [start, end]
          properties:
            start:
              type: string
              pattern: '^\d{2}:\d{2}$'
            end:
              type: string
              pattern: '^\d{2}:\d{2}$'
            days:
              type: array
              items:
                type: integer
                minimum: 0
                maximum: 6
        max_runs_per_day:
          type: [integer, 'null']
          minimum: 1
        skip_if_status_in:
          description: Défaut `[erreur, action_requise, bloquee]` (on ne sollicite pas un site qui a refusé).
          type: array
          items:
            $ref: '#/components/schemas/ApiStatus'
        dedup_key:
          type: [string, 'null']
        diff:
          type: [string, 'null']
          enum: [new, changed, removed, all, null]
        alert_on:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [new_items, status_change, error]
    ScheduleWrite:
      type: object
      additionalProperties: false
      required: [cron, timezone, input]
      properties:
        cron:
          type: string
          maxLength: 100
        timezone:
          type: string
          maxLength: 64
        input:
          description: Entrée du run ; variables datées `{{today}}`, `{{yesterday}}`.
          type: object
          additionalProperties: true
        overlap:
          type: string
          enum: [skip, queue, allow]
          default: skip
        missed:
          type: string
          enum: [once, skip]
          default: once
        rules:
          $ref: '#/components/schemas/ScheduleRules'
        enabled:
          type: boolean
    SchedulePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        cron:
          type: string
          maxLength: 100
        timezone:
          type: string
          maxLength: 64
        input:
          type: object
          additionalProperties: true
        overlap:
          type: string
          enum: [skip, queue, allow]
        missed:
          type: string
          enum: [once, skip]
        rules:
          $ref: '#/components/schemas/ScheduleRules'
        enabled:
          type: boolean
    Schedule:
      type: object
      additionalProperties: false
      required: [id, api_slug, cron, timezone, input, overlap, missed, rules, enabled, next_runs, created_at]
      properties:
        id:
          type: string
          format: uuid
        api_slug:
          type: string
        cron:
          type: string
        timezone:
          type: string
        input:
          type: object
          additionalProperties: true
        overlap:
          type: string
          enum: [skip, queue, allow]
        missed:
          type: string
          enum: [once, skip]
        rules:
          $ref: '#/components/schemas/ScheduleRules'
        enabled:
          type: boolean
        paused_reason:
          type: [string, 'null']
        next_runs:
          description: Prochaines exécutions calculées côté serveur (06 § 1, aucun composant cron dans la console).
          type: array
          items:
            type: string
            format: date-time
        created_at:
          type: string
          format: date-time
    ScheduleList:
      type: object
      additionalProperties: false
      required: [schedules]
      properties:
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/Schedule'
    # ——— Webhooks (Standard Webhooks, 08 § 5) ———
    WebhookEvent:
      type: string
      enum: [run.succeeded, run.failed, api.status_changed, items.new, api.persistence_attempt]
    WebhookDelivery:
      type: object
      additionalProperties: false
      required: [id, at, event, attempt, status_code, duration_ms]
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        event:
          description: Événement livré (`WebhookEvent`), ou `webhook.test` pour le bouton Tester.
          type: string
        attempt:
          type: integer
        status_code:
          type: [integer, 'null']
        duration_ms:
          type: [integer, 'null']
        excerpt:
          type: [string, 'null']
    WebhookSubscription:
      type: object
      required: [id, url, events, api_slug, status, tested_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEvent'
        api_slug:
          description: API concernée, ou null pour l'alerte d'instance par défaut.
          type: [string, 'null']
        status:
          type: string
          enum: [active, disabled]
        tested_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
    WebhookSubscriptionWrite:
      type: object
      additionalProperties: false
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WebhookEvent'
        api_slug:
          description: API dont les événements sont livrés ; absent ou null, toutes les API du propriétaire.
          type: [string, 'null']
    WebhookSubscriptionPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WebhookEvent'
        status:
          type: string
          enum: [active, disabled]
        rotate_secret:
          description: Nouveau secret ; l'ancien reste accepté pendant la rotation (sauf si l'URL change dans la même requête).
          type: boolean
    WebhookSubscriptionCreated:
      allOf:
        - $ref: '#/components/schemas/WebhookSubscription'
        - type: object
          properties:
            secret:
              description: Secret `whsec_…`, renvoyé une seule fois (création ou rotation).
              type: string
    WebhookSubscriptionList:
      type: object
      additionalProperties: false
      required: [subscriptions]
      properties:
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/WebhookSubscription'
    TestResult:
      type: object
      required: [ok, tested_at]
      properties:
        ok:
          type: boolean
        tested_at:
          type: string
          format: date-time
        error:
          description: Échec lisible, en code stable.
          oneOf:
            - $ref: '#/components/schemas/ReasonMessage'
            - type: 'null'
    # ——— Réglages (08 § 7, 13) : les secrets sont en écriture seule, jamais relus (INV8) ———
    LlmPreset:
      type: string
      enum: [zai, openrouter, vllm, ollama, deepseek, qwen, openai, custom]
    LlmProfile:
      type: object
      additionalProperties: false
      properties:
        tools:
          type: boolean
        tool_choice:
          type: array
          items:
            type: string
        structured:
          type: string
          enum: [json_schema, tool_forced, json_object, none]
        stream_tools:
          type: boolean
        stream_usage:
          type: boolean
        cache:
          type: boolean
        reasoning_field:
          type: [string, 'null']
        sampling:
          description: Paramètres d'échantillonnage acceptés par le modèle (mesurés par la sonde) ; un paramètre refusé n'est jamais envoyé.
          type: object
          additionalProperties: false
          properties:
            temperature:
              type: boolean
            top_p:
              type: boolean
    LlmPrice:
      type: object
      additionalProperties: false
      properties:
        in:
          type: number
        in_cached:
          type: number
        in_cache_write:
          type: number
        out:
          type: number
        windows:
          type: array
          items:
            type: object
            additionalProperties: true
        as_of:
          type: string
    LlmModel:
      type: object
      additionalProperties: false
      properties:
        profile:
          oneOf:
            - $ref: '#/components/schemas/LlmProfile'
            - type: 'null'
        price:
          oneOf:
            - $ref: '#/components/schemas/LlmPrice'
            - type: 'null'
        extra_body:
          type: object
          additionalProperties: true
    LlmRole:
      type: object
      additionalProperties: false
      required: [provider, model]
      properties:
        provider:
          type: string
        model:
          type: string
        fallback:
          type: [object, 'null']
          additionalProperties: false
          required: [provider, model]
          properties:
            provider:
              type: string
            model:
              type: string
        provider_routing:
          type: object
          additionalProperties: true
    LlmRoles:
      type: object
      additionalProperties: false
      properties:
        investigate:
          $ref: '#/components/schemas/LlmRole'
        repair:
          $ref: '#/components/schemas/LlmRole'
        extract:
          $ref: '#/components/schemas/LlmRole'
        agent:
          $ref: '#/components/schemas/LlmRole'
        judge:
          description: Juge de qualité consultatif (tâche 2.12, 19 § 3), actif seulement avec `judge.enabled`.
          $ref: '#/components/schemas/LlmRole'
        reflect:
          description: Propositions de règles, toujours validées par un humain (19 § 5).
          $ref: '#/components/schemas/LlmRole'
        embed:
          description: Embeddings de l'étage 4 de la mémoire du catalogue (option désactivée, `catalog_memory.embeddings`).
          $ref: '#/components/schemas/LlmRole'
    LlmProviderBase:
      type: object
      required: [id, preset, base_url]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
        preset:
          $ref: '#/components/schemas/LlmPreset'
        base_url:
          type: string
          maxLength: 2048
        timeout_ms:
          type: integer
          minimum: 1000
        max_retries:
          type: integer
          minimum: 0
          maximum: 3
        models:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LlmModel'
    LlmProvider:
      allOf:
        - $ref: '#/components/schemas/LlmProviderBase'
        - type: object
          required: [api_key_set, headers_set]
          properties:
            api_key_set:
              type: boolean
            headers_set:
              type: boolean
            api_key_unreadable:
              description: Secret illisible (`secret_unreadable`, 06 § 4.2) ; à ressaisir.
              type: boolean
    LlmProviderWrite:
      allOf:
        - $ref: '#/components/schemas/LlmProviderBase'
        - type: object
          properties:
            api_key:
              description: Écriture seule ; absent = clé conservée.
              type: string
              writeOnly: true
              maxLength: 4096
            headers:
              description: En-têtes personnalisés, chiffrés comme la clé ; écriture seule.
              type: object
              writeOnly: true
              additionalProperties:
                type: string
    LlmSettingsCommon:
      type: object
      properties:
        roles:
          $ref: '#/components/schemas/LlmRoles'
        redact:
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            patterns:
              type: array
              items:
                type: string
        log_prompts:
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            retention_days:
              type: integer
              minimum: 1
        judge:
          description: >-
            Juge consultatif (tâche 2.12, 19 § 3) : désactivé par défaut, activé par l'admin avec l'avertissement « juge non
            étalonné, avis consultatif » ; son fournisseur s'ajoute à la mention fournisseur.
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
        catalog_memory:
          description: Mémoire du catalogue (19 § 2) ; l'étage 4 par embeddings est une option désactivée (pgvector requis).
          type: object
          additionalProperties: false
          properties:
            embeddings:
              type: boolean
    LlmSettings:
      allOf:
        - $ref: '#/components/schemas/LlmSettingsCommon'
        - type: object
          required: [providers]
          properties:
            providers:
              type: array
              items:
                $ref: '#/components/schemas/LlmProvider'
            validated_models:
              description: >-
                Statut « modèle validé » du banc d'évaluation (15 § 11), en lecture seule : copie de eval/validated-models.json
                (produit par `pnpm eval --level N2`). Un modèle configuré absent de la liste n'a jamais été mesuré : « non validé ».
              type: array
              readOnly: true
              items:
                $ref: '#/components/schemas/ValidatedModel'
            known_prices:
              description: >-
                Prix connus (UX-11), en lecture seule : table versionnée de la couche LLM (USD par million de jetons) qui
                pré-remplit le prix d'un modèle reconnu par son nom. Le prix saisi dans `providers[].models[m].price` fait foi.
              type: array
              readOnly: true
              items:
                $ref: '#/components/schemas/KnownModelPrice'
    KnownModelPrice:
      type: object
      additionalProperties: false
      required: [model, provider, status, price, source]
      properties:
        model:
          type: string
        provider:
          type: string
        status:
          description: '`verified` : prix relevé dans le dépôt ; `to_validate` : aucun prix relevé, à saisir.'
          type: string
          enum: [verified, to_validate]
        price:
          oneOf:
            - type: object
              additionalProperties: false
              required: [in, out]
              properties:
                in:
                  type: number
                out:
                  type: number
                in_cached:
                  type: number
            - type: 'null'
        source:
          type: string
        as_of:
          type: string
    ValidatedModel:
      type: object
      additionalProperties: false
      required: [model_id, date, status, level]
      properties:
        model_id:
          type: string
        date:
          type: string
          format: date
        status:
          type: string
          enum: [validated, not_validated]
        level:
          type: string
          enum: [N2]
        blocking_rules:
          type: array
          items:
            type: string
    LlmSettingsWrite:
      allOf:
        - $ref: '#/components/schemas/LlmSettingsCommon'
        - type: object
          required: [providers]
          properties:
            providers:
              type: array
              items:
                $ref: '#/components/schemas/LlmProviderWrite'
    LlmProbeRequest:
      type: object
      additionalProperties: false
      required: [provider, model]
      properties:
        provider:
          type: string
        model:
          type: string
    LlmProbeResult:
      allOf:
        - $ref: '#/components/schemas/TestResult'
        - type: object
          properties:
            profile:
              oneOf:
                - $ref: '#/components/schemas/LlmProfile'
                - type: 'null'
    ProxyType:
      description: '`dc` : serveur ; `res` : résidentiel, opt-in par API (08 § 2).'
      type: string
      enum: [dc, res]
    ProxyPrice:
      type: object
      additionalProperties: false
      properties:
        per_gb_usd:
          type: [number, 'null']
        per_request_usd:
          type: [number, 'null']
    Proxy:
      type: object
      additionalProperties: false
      required: [id, label, type, url, username_set, password_set, params, price, tested_at]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        type:
          $ref: '#/components/schemas/ProxyType'
        url:
          description: Schéma, hôte et port, sans identifiants.
          type: string
        username_set:
          type: boolean
        password_set:
          type: boolean
        params:
          type: object
          additionalProperties:
            type: string
        username_template:
          type: [string, 'null']
        price:
          $ref: '#/components/schemas/ProxyPrice'
        tested_at:
          type: [string, 'null']
          format: date-time
    ProxyWrite:
      type: object
      additionalProperties: false
      required: [label, type, url]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/ProxyType'
        url:
          type: string
          maxLength: 2048
        username:
          type: string
          writeOnly: true
          maxLength: 1024
        password:
          type: string
          writeOnly: true
          maxLength: 1024
        params:
          type: object
          additionalProperties:
            type: string
        username_template:
          type: [string, 'null']
          maxLength: 512
        price:
          $ref: '#/components/schemas/ProxyPrice'
    ProxyPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          maxLength: 2048
        username:
          type: string
          writeOnly: true
          maxLength: 1024
        password:
          type: string
          writeOnly: true
          maxLength: 1024
        params:
          type: object
          additionalProperties:
            type: string
        username_template:
          type: [string, 'null']
          maxLength: 512
        price:
          $ref: '#/components/schemas/ProxyPrice'
    ProxyList:
      type: object
      additionalProperties: false
      required: [proxies]
      properties:
        proxies:
          type: array
          items:
            $ref: '#/components/schemas/Proxy'
    ProxyTestResult:
      allOf:
        - $ref: '#/components/schemas/TestResult'
        - type: object
          properties:
            exit_ip:
              type: [string, 'null']
            exit_country:
              type: [string, 'null']
    SmtpSettings:
      type: object
      additionalProperties: false
      required: [host, port, security, from, username_set, password_set, tested_at]
      properties:
        host:
          type: string
        port:
          type: integer
        security:
          type: string
          enum: [tls, starttls, none]
        from:
          type: string
        username_set:
          type: boolean
        password_set:
          type: boolean
        tested_at:
          type: [string, 'null']
          format: date-time
    SmtpSettingsWrite:
      type: object
      additionalProperties: false
      required: [host, port, security, from]
      properties:
        host:
          type: string
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
        security:
          type: string
          enum: [tls, starttls, none]
        from:
          type: string
          maxLength: 254
        username:
          type: string
          writeOnly: true
          maxLength: 1024
        password:
          type: string
          writeOnly: true
          maxLength: 1024
    SecuritySettings:
      type: object
      additionalProperties: false
      required: [session_idle_minutes, session_absolute_hours, allowed_email_domains, api_key_max_lifetime_days]
      properties:
        session_idle_minutes:
          type: integer
          minimum: 5
          maximum: 720
        session_absolute_hours:
          type: integer
          minimum: 1
          maximum: 720
        allowed_email_domains:
          type: array
          items:
            type: string
        api_key_max_lifetime_days:
          type: integer
          minimum: 1
          maximum: 365
        audit_retention_months:
          type: integer
          minimum: 1
          maximum: 120
    IdentitySettings:
      type: object
      additionalProperties: false
      required: [identify_instance, identify_effective, identify_source, instance_contact, instance_contact_effective, instance_contact_source, engine, worker_version, user_agent, user_agent_identified, product_version]
      properties:
        identify_instance:
          type: [boolean, 'null']
          description: "Réglage admin ; null tant qu'il n'est pas posé (le worker retombe sur IDENTIFY_INSTANCE, puis sur désactivé)."
        identify_effective:
          type: [boolean, 'null']
          description: "Valeur que le worker applique : le réglage, sinon IDENTIFY_INSTANCE publiée par le worker, sinon désactivé ; null sans réglage tant qu'aucun worker n'a publié son environnement."
        identify_source:
          type: [string, 'null']
          enum: [setting, env, default, null]
          description: "Origine de identify_effective : réglage admin, environnement du worker, ou défaut (désactivé)."
        instance_contact:
          type: [string, 'null']
          description: "Contact d'instance normalisé (URL http(s) ou mailto:) ; null tant qu'il n'est pas posé (repli : INSTANCE_CONTACT)."
        instance_contact_effective:
          type: [string, 'null']
          description: "Contact que le worker annonce : le réglage, sinon INSTANCE_CONTACT publiée par le worker ; null si aucun."
        instance_contact_source:
          type: [string, 'null']
          enum: [setting, env, null]
          description: "Origine de instance_contact_effective : réglage ou environnement du worker."
        engine:
          type: [object, 'null']
          additionalProperties: false
          required: [version, platform]
          description: Moteur embarqué tel que le worker le publie ; null tant qu'aucun worker n'a démarré.
          properties:
            version:
              type: string
            platform:
              type: string
        worker_version:
          type: [string, 'null']
          description: "Version que le worker annonce dans le jeton (sa RUNTIME_VERSION), publiée avec son moteur ; null pour un worker qui ne la publie pas."
        user_agent:
          type: [string, 'null']
          description: "User-Agent réel du moteur (lecture seule, sans HeadlessChrome)."
        user_agent_identified:
          type: [string, 'null']
          description: "Le même User-Agent suivi du jeton compatible; Scrapyomama/<version du worker>; +<contact appliqué>, tel qu'il part quand l'identification est activée."
        product_version:
          type: string
    IdentitySettingsWrite:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        identify_instance:
          type: boolean
        instance_contact:
          type: [string, 'null']
          maxLength: 400
          description: "URL http(s), mailto: ou adresse électronique, sans espace ni saut de ligne ; null efface le réglage."
    SsoCommon:
      type: object
      properties:
        enabled:
          type: boolean
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,31}$'
        label:
          type: string
          maxLength: 100
        issuer_url:
          type: string
          maxLength: 2048
        client_id:
          type: string
          maxLength: 512
        sso_required:
          type: boolean
        jit_provisioning:
          description: Création à la volée (13 § 7), désactivée par défaut ; activée, `domains` doit compter au moins un domaine (sinon 400 `invalid_settings`).
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            domains:
              type: array
              items:
                type: string
        group_roles:
          description: Correspondance groupe d'IdP → rôle ; `owner` n'est jamais attribuable.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [group, role]
            properties:
              group:
                type: string
              role:
                type: string
                enum: [member, admin]
    SsoSettings:
      allOf:
        - $ref: '#/components/schemas/SsoCommon'
        - type: object
          required: [enabled, slug, issuer_url, client_id, client_secret_set]
          properties:
            client_secret_set:
              type: boolean
    SsoSettingsWrite:
      allOf:
        - $ref: '#/components/schemas/SsoCommon'
        - type: object
          required: [enabled, slug, issuer_url, client_id]
          properties:
            client_secret:
              description: Écriture seule ; absent = secret conservé.
              type: string
              writeOnly: true
              maxLength: 4096
    SsoPublic:
      type: object
      additionalProperties: false
      required: [enabled, sso_required, providers]
      properties:
        enabled:
          type: boolean
        sso_required:
          type: boolean
        providers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [slug, label]
            properties:
              slug:
                type: string
              label:
                type: string
    # ——— Comptes (13) ———
    UserStatus:
      type: string
