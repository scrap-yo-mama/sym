# SPDX-License-Identifier: MIT
# OpenAPI 3.1 SPÉCIFIÉE de l'API REST (CDC 05 § 2 et § 4.2, 13 § 13.1, 06), source du client généré (tâche 3.3).
# Elle décrit TOUTES les routes du CDC, pour que la console (3.4, 3.5, 3.8) avance sans attendre le serveur (3.1).
# Liste d'attente : une opération pas encore livrée par le serveur porte `x-pending: '<tâche>'` ; la tâche qui la livre
# retire la marque (tests/openapi-client.contract.test.ts, assert_openapi_specified_vs_delivered_drift). La tâche 3.6
# rejoue le contrôle contre l'OpenAPI générée par le serveur (15 § 6) et exige une liste d'attente vide.
# Les opérations marquées « extension de 05 § 4.2 » servent un écran de 06 que 05 ne détaille pas ; 3.1 les confirme.
# Champs : snake_case comme les contrats de 04b et 05 (les routes déjà livrées par 0.3b, en camelCase, restent telles quelles).
# Les textes affichés ne viennent jamais de l'API : seulement des codes stables (06 § 1, « Accessibilité et langues »).
openapi: 3.1.0
info:
  title: Scrapyomama Runtime API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
# Par défaut : session d'interface (cookie) ou clé d'API (Bearer, scopes de 13 § 8). Les routes publiques posent `security: []` ;
# les routes réservées à la session (registre `auth: 'session'`) posent `security: [{sessionCookie: []}]` : jamais une clé d'API
# sur une route d'administration (13 § 8). Le test de dérive compare ce mode d'authentification au registre du serveur.
security:
  - sessionCookie: []
  - apiKey: []
tags:
  - name: system
  - name: auth
  - name: account
  - name: events
  - name: apis
  - name: runs
  - name: datasets
  - name: schedules
  - name: webhooks
  - name: settings
  - name: users
  - name: audit
  - name: subjects
  - name: tunnel
paths:
  /api/health:
    get:
      operationId: getHealth
      security: []
      tags: [system]
      summary: Santé du processus (joignable avant l'initialisation)
      responses:
        '200':
          description: Le processus répond.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/ready:
    get:
      operationId: getReady
      security: []
      tags: [system]
      summary: Disponibilité (version de schéma, base) et état d'initialisation
      responses:
        '200':
          description: Prêt ; `initialized` vaut false tant que l'assistant n'a pas créé l'owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          description: Pas prêt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotReady'
  /api/setup:
    post:
      operationId: postSetup
      security: []
      tags: [system]
      summary: Assistant de premier démarrage (13 § 4), répond 404 pour toujours une fois l'owner créé
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '201':
          description: Owner créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupResult'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/auth/sign-in/email:
    post:
      operationId: postSignIn
      security: []
      tags: [auth]
      summary: Connexion par e-mail et mot de passe (cookie de session HttpOnly)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Connecté ; le jeton de session ne sort que dans le cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResult'
        '401':
          description: Identifiants invalides (réponse identique pour tout échec, 13 § 5).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '429':
          description: Trop de tentatives (par IP ou par compte).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
        '503':
          $ref: '#/components/responses/Error'
  /api/auth/sign-out:
    post:
      operationId: postSignOut
      security: []
      tags: [auth]
      summary: Déconnexion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        '200':
          description: Session fermée.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  success:
                    type: boolean
        '401':
          $ref: '#/components/responses/Error'
  /api/auth/get-session:
    get:
      operationId: getSession
      security: []
      tags: [auth]
      summary: Session d'interface courante (null sans session)
      responses:
        '200':
          description: Session ou null.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionInfo'
                  - type: 'null'
        '503':
          $ref: '#/components/responses/Error'
  /api/auth/two-factor/verify:
    post:
      operationId: verifyTwoFactor
      security:
        - sessionCookie: []
      tags: [auth]
      summary: Second facteur d'une session en attente (code TOTP ou code de secours) ; remplace la session (nouveau jeton, 13 § 7)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondFactorCode'
      responses:
        '200':
          description: Session complète (cookie), appareil reconnu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecondFactorResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      security: []
      tags: [auth]
      summary: Mot de passe oublié (avec SMTP) ; réponse identique que le compte existe ou non (13 § 4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Demande prise en compte (un e-mail part si le compte existe et si SMTP est configuré).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [accepted]
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/auth/password-reset/confirm:
    post:
      operationId: resetPassword
      security: []
      tags: [auth]
      summary: Nouveau mot de passe par lien à usage unique ; second facteur exigé si le compte en a un ; révoque sessions, clés, jetons et cookies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
      responses:
        '204':
          description: Mot de passe changé ; tous les accès du compte révoqués.
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/auth/oidc/start:
    get:
      operationId: startOidc
      security: []
      tags: [auth]
      summary: Redirige vers le fournisseur OIDC de l'instance (PKCE S256, state et nonce liés au navigateur) ; connexion ou acceptation d'invitation, jamais liaison
      parameters:
        - name: intent
          in: query
          description: '`login` (seule valeur). La liaison à un compte ouvert passe par `POST /api/me/identities/oidc` (ré-authentification).'
          schema:
            type: string
            enum: [login]
        - name: invitation
          in: query
          description: Jeton d'invitation à accepter par l'IdP (adresse vérifiée égale à celle de l'invitation).
          schema:
            type: string
      responses:
        '302':
          description: Redirection vers l'IdP, ou vers `/login?sso_error=<code>`.
  /api/auth/oidc/callback:
    get:
      operationId: oidcCallback
      security: []
      tags: [auth]
      summary: Retour du fournisseur OIDC ; identité = (issuer, sub), jamais l'e-mail
      responses:
        '302':
          description: Vers la console (session ouverte), `/login?mfa=1` (second facteur attendu) ou `/login?sso_error=<code>`.
  /api/me:
    get:
      operationId: getMe
      tags: [account]
      summary: Identité de l'appelant, relue en base
      responses:
        '200':
          description: Identité.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/api-keys:
    get:
      operationId: listApiKeys
      security:
        - sessionCookie: []
      tags: [account]
      summary: Clés d'API de l'appelant (session d'interface seulement)
      responses:
        '200':
          description: Liste, sans aucun secret.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      operationId: createApiKey
      security:
        - sessionCookie: []
      tags: [account]
      summary: Crée une clé (ré-authentification, voir `CurrentPassword`) ; le secret n'apparaît qu'ici
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreate'
      responses:
        '201':
          description: Clé créée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/ReauthError'
        '429':
          $ref: '#/components/responses/Error'
  /api/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      security:
        - sessionCookie: []
      tags: [account]
      summary: Révoque une clé de l'appelant (404 pour la clé d'autrui)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Révoquée.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/events:
    get:
      operationId: streamEvents
      tags: [events]
      summary: Flux SSE multiplexé, un seul par onglet (06 § 3)
      description: >-
        Trames `id:`, `event:`, `data:` (JSON), commentaire `: ping` toutes les 15 à 20 s. Reprise par l'en-tête
        `Last-Event-ID` sur des événements persistés : la console le renvoie à chaque reconnexion et ignore tout
        événement dont l'identifiant a déjà été vu. Les noms d'événements sont définis avec le serveur (tâche 3.1).
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Flux d'événements.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/version:
    get:
      operationId: getVersion
      security: []
      tags: [system]
      summary: Version de l'instance et du schéma (14 § 3), sans version de dépendance ni nom d'hôte
      responses:
        '200':
          description: Version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /metrics:
    get:
      operationId: getMetrics
      tags: [system]
      summary: Métriques Prometheus (14 § 3), fermées sans METRICS_TOKEN
      security:
        - metricsToken: []
      responses:
        '200':
          description: Texte d'exposition Prometheus (préfixe `scrapyomama_`, étiquettes bornées).
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Jeton faux.
        '404':
          description: METRICS_TOKEN absent (route fermée).
  /.well-known/oauth-protected-resource:
    get:
      operationId: getProtectedResourceMetadata
      security: []
      tags: [system]
      summary: Métadonnées de ressource protégée (RFC 9728, 13 § 11)
      responses:
        '200':
          description: Métadonnées.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedResourceMetadata'
  /api/openapi.json:
    get:
      operationId: getOpenApi
      tags: [system]
      summary: OpenAPI 3.1 livrée par le serveur (05 § 2) ; comparée à ce fichier par le test de dérive (15 § 6, tâche 3.6)
      responses:
        '200':
          description: Document OpenAPI 3.1.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/sso:
    get:
      operationId: getSsoInfo
      security: []
      tags: [auth]
      summary: Connexion SSO proposée sur la page de connexion (public, sans secret)
      responses:
        '200':
          description: État public du SSO.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoPublic'
  /api/apis:
    get:
      operationId: listApis
      tags: [apis]
      summary: Catalogue (= list_apis), pagination serveur, filtres par statut, exécution et réseau, recherche (06 § 2)
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ApiStatus'
        - name: execution
          in: query
          schema:
            $ref: '#/components/schemas/Execution'
        - name: network
          in: query
          schema:
            $ref: '#/components/schemas/Network'
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page du catalogue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      operationId: createApi
      tags: [apis]
      summary: Crée une API (= create_api) ; lance l'enquête, rapport d'accès en étape 0 (17 § 2)
      parameters:
        - $ref: '#/components/parameters/Wait'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCreate'
      responses:
        '507':
          $ref: '#/components/responses/Error'
        '201':
          description: API créée ; schéma proposé à valider, ou résultat de run si `auto_validate`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiCreated'
                  - $ref: '#/components/schemas/RunResult'
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/QueueFull'
  /api/apis/import:
    post:
      operationId: importApi
      tags: [apis]
      summary: Importe une API exportée (16 § 6) ; aperçu sans écriture, puis confirm=true ; repasse toujours par l'enquête
      description: >-
        Sans `confirm=true` : aperçu (200), rien n'est écrit. Avec `confirm=true` : nouvelle API privée en `enquete`,
        enquête en file au stade `access_check` (rapport d'accès, robots.txt) puis `testing` de la stratégie importée
        (`created_by: import`) ; planifications recréées désactivées, cibles d'alerte à configurer. Les champs inconnus
        sont ignorés (`ignored_fields`) ; un `$ref` distant (400 `remote_ref`), une empreinte fausse (400
        `integrity_mismatch`) ou une version de format d'une autre majeure (400 `unsupported_format`) sont refusés.
      parameters:
        - name: confirm
          in: query
          required: false
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiExport'
      responses:
        '200':
          description: Aperçu de l'import (aucune écriture).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiImportPreview'
        '429':
          $ref: '#/components/responses/QueueFull'
        '507':
          $ref: '#/components/responses/Error'
        '201':
          description: API importée, enquête lancée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCreated'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/apis/{id}/validate-schema:
    post:
      operationId: validateSchema
      tags: [apis]
      summary: Valide (ou corrige) le schéma de sortie proposé (= validate_schema)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Wait'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateSchemaRequest'
      responses:
        '200':
          description: Enquête terminée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResult'
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/QueueFull'
        '409':
          $ref: '#/components/responses/Error'
  /api/apis/{slug}:
    get:
      operationId: getApi
      tags: [apis]
      summary: Fiche d'une API (= get_api) ; métadonnées seules pour l'admin sur une API avec session d'autrui
      parameters:
        - $ref: '#/components/parameters/Slug'
        - name: response_format
          in: query
          schema:
            type: string
            enum: [concise, detailed]
      responses:
        '200':
          description: Fiche.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetail'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateApi
      tags: [apis]
      summary: Modifie description, politiques, schémas (→ ré-enquête), exposition MCP ; aucun réglage robots.txt (INV11)
      description: >-
        Mode « SYM ne lâche pas » (`persistence_mode`, `persistence_budget_usd`, D-49) : décidé avant tout autre champ ;
        refusé, rien n'est écrit. Activer (ou changer le plafond d'un mode actif) par une clé d'API :
        `403 human_confirmation_required` ; API sans version courante, mémoire des refus absente ou plafond effectif ≤ 0 :
        `409 persistence_not_eligible` (`reason`) ; les deux avec `what_to_do`. Désactiver est permis à toute clé.
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiPatch'
      responses:
        '409':
          $ref: '#/components/responses/Error'
        '200':
          description: Fiche à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDetail'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: >-
            `human_confirmation_required` : activation du mode « SYM ne lâche pas » (ou changement de son plafond) hors de
            la console, par une clé d'API, avec `what_to_do` ; `insufficient_scope` : clé sans `apis:write`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteApi
      tags: [apis]
      summary: Supprime une API
      description: >-
        Supprime l'API, ses versions et les runs, datasets et planifications de son propriétaire. `409 runs_active` tant
        qu'un run est actif ; `409 api_in_use_by_others` si un autre membre a un run, un dataset ou une planification sur
        cette API `instance` (ses données ne partent jamais avec l'API d'autrui, INV12).
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '409':
          $ref: '#/components/responses/Error'
        '204':
          description: Supprimée.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/apis/{slug}/runs:
    post:
      operationId: runApi
      tags: [runs]
      summary: Lance un run (= run_api) ; synchrone jusqu'à `wait` secondes, sinon run à suivre (05 § 4.3)
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Wait'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '507':
          $ref: '#/components/responses/Error'
        '200':
          description: Run terminé (y compris dégradé, ou en échec de budget).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResult'
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/QueueFull'
  /api/apis/{slug}/investigate:
    post:
      operationId: reinvestigateApi
      tags: [apis]
      summary: Ré-enquête manuelle (transitions 17 et 18) ; seule reprise offerte à une API `bloquee`
      description: >-
        La transition et l'enquête partent au même COMMIT : une enquête refusée (demande illisible, file pleine) laisse
        l'API dans son statut. Une API `bloquee` ne repart que par un geste humain dans la console (transition 18, 04 § 6) :
        par une clé d'API, `403 human_confirmation_required`, sans transition ni run.
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: false
        content:
          application/json:
            schema:
