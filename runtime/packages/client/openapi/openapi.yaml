      summary: Code d'appairage de l'extension, usage unique, 10 minutes (07 § 1) ; session récente exigée
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordConfirmation'
      responses:
        '201':
          description: Code créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCode'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  # ——— Extension Chrome, livrées par 2.6 (07 § 1-2 ; champs en camelCase comme les autres routes déjà livrées) ———
  /api/extension/pairing-codes:
    post:
      operationId: createExtensionPairingCode
      security:
        - sessionCookie: []
      tags: [tunnel]
      summary: Code d'appairage de l'extension, usage unique, 10 minutes (07 § 1) ; ré-authentification (voir `CurrentPassword`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionPairingCodeRequest'
      responses:
        '201':
          description: Code créé (seule apparition).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionPairingCode'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/ReauthError'
        '429':
          $ref: '#/components/responses/Error'
  /api/extension/pair:
    post:
      operationId: pairExtension
      security: []
      tags: [tunnel]
      summary: Échange d'un code d'appairage contre un jeton d'appareil (07 § 1) ; limité par IP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionPairRequest'
      responses:
        '201':
          description: Jeton d'appareil (seule apparition).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionPaired'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/extension/session:
    get:
      operationId: getExtensionSession
      security:
        - deviceToken: []
      tags: [tunnel]
      summary: Appareil et domaines connectés du jeton (07 § 2)
      responses:
        '200':
          description: Session de l'extension.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionSession'
        '401':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteExtensionSession
      security:
        - deviceToken: []
      tags: [tunnel]
      summary: "Déconnexion de l'appareil, le jeton est révoqué (07 § 2)"
      responses:
        '204':
          description: Fait.
        '401':
          $ref: '#/components/responses/Error'
  /api/extension/tunnel:
    get:
      operationId: openExtensionTunnel
      security: []
      tags: [tunnel]
      summary: "WebSocket du tunnel (07 § 6) : jeton d'appareil dans le premier message, jamais dans l'URL"
      description: >-
        Ouverture refusée avec un paramètre d'URL (400) ou une Origin autre qu'une extension (403). Puis messages JSON
        (schéma strict, 1 Mio au plus par message, compression désactivée) : extension → instance hello, ping, result
        (découpé en morceaux seq/last) ; instance → extension welcome, pong, cmd (http_fetch, page_fetch, page_script,
        agent_step). Fermetures 4401 (jeton refusé ou révoqué), 4409 (connexion plus récente du même utilisateur),
        4400 (protocole), 4429 (débit), 4408 (pas de hello).
      responses:
        '101':
          description: Protocole changé (WebSocket).
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '426':
          $ref: '#/components/responses/Error'
  /api/extension/sites/{domain}:
    put:
      operationId: connectExtensionSite
      security:
        - deviceToken: []
      tags: [tunnel]
      summary: Consentement par domaine et choix du mode (usage serveur ou tunnel) (07 § 2)
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
            maxLength: 253
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionSiteConnect'
      responses:
        '200':
          description: Domaine déjà connecté, mode mis à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedSite'
        '201':
          description: Domaine connecté.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedSite'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
    delete:
      operationId: disconnectExtensionSite
      security:
        - deviceToken: []
      tags: [tunnel]
      summary: Déconnexion d'un domaine (les cookies serveur sont supprimés) (07 § 2)
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
            maxLength: 253
      responses:
        '204':
          description: Fait.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/extension/sites/{domain}/cookies:
    put:
      operationId: putExtensionSiteCookies
      security:
        - deviceToken: []
      tags: [tunnel]
      summary: Cookies d'un domaine en usage serveur, écriture seule, scellés (07 § 2) ; remplacé par la WSS en 2.7
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
            maxLength: 253
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionSiteCookies'
      responses:
        '204':
          description: Fait.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/extension/devices:
    get:
      operationId: listExtensionDevices
      security:
        - sessionCookie: []
      tags: [tunnel]
      summary: Appareils appairés de l'utilisateur (06 § 2, Paramètres)
      responses:
        '200':
          description: Appareils.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionDeviceList'
        '401':
          $ref: '#/components/responses/Error'
  /api/extension/devices/{id}:
    delete:
      operationId: revokeExtensionDevice
      security:
        - sessionCookie: []
      tags: [tunnel]
      summary: Révocation d'un appareil de l'utilisateur (07 § 1)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Fait.
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/sites:
    get:
      operationId: listConnectedSites
      tags: [tunnel]
      summary: Domaines connectés de l'utilisateur (06 § 2, Paramètres)
      responses:
        '200':
          description: Domaines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedSiteList'
        '401':
          $ref: '#/components/responses/Error'
  /api/sites/{id}:
    delete:
      operationId: disconnectConnectedSite
      security:
        - sessionCookie: []
      tags: [tunnel]
      summary: Déconnexion d'un domaine depuis la console
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Fait.
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/admin/tunnels:
    get:
      operationId: listAdminTunnels
      security:
        - sessionCookie: []
      tags: [tunnel]
      summary: Appareils de l'instance, métadonnées seules (jamais un jeton) ; admin (13 § 4)
      responses:
        '200':
          description: Appareils.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminExtensionDeviceList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/admin/tunnels/{id}:
    delete:
      operationId: revokeAdminTunnel
      security:
        - sessionCookie: []
      tags: [tunnel]
      summary: Révocation d'un appareil par un admin (révocation seule, INV5)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Fait.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-sy.session
      description: Session d'interface (13 § 5) ; `sy.session` sans le préfixe `__Host-` quand PUBLIC_URL est en http (développement).
    apiKey:
      type: http
      scheme: bearer
      description: Clé d'API `sy_live_…` à scopes (13 § 8) ; jamais de scope d'administration.
    deviceToken:
      type: http
      scheme: bearer
      description: Jeton d'appareil de l'extension (07 § 1), lié à (utilisateur, appareil) ; jamais accepté hors de /api/extension.
    metricsToken:
      type: http
      scheme: bearer
      description: METRICS_TOKEN (14 § 3), distinct des clés d'API.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Cursor:
      name: cursor
      in: query
      description: Curseur opaque renvoyé par la page précédente (`next_cursor`).
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
    Wait:
      name: wait
      in: query
      description: Attente synchrone maximale en secondes (05 § 2) ; au-delà, 202 et run à suivre.
      schema:
        type: integer
        minimum: 0
        maximum: 25
  responses:
    Error:
      description: "Erreur au format commun `{ error: { code, message } }` (le code est stable, jamais localisé)."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ReauthError:
      description: >-
        Ré-authentification refusée (13 § 5) : `reauth_failed` (mot de passe actuel incorrect) ; `reauth_required`
        (compte OIDC seul dont la connexion date de plus de 10 minutes : se reconnecter chez le fournisseur
        d’identité) ; ou autre refus de l’opération (`forbidden`, `mfa_required`, `mfa_enforced`...).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Accepted:
      description: Accepté ; run (ou enquête) à suivre par `GET /api/runs/{id}` ou le flux SSE (05 § 4.3).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RunAccepted'
    QueueFull:
      description: File pleine (`queue_full`), au-delà de `max_concurrent_runs` ; réessayer après `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    AuthError:
      description: Erreur de la bibliothèque d'authentification (format à plat, sans enveloppe `error`).
      type: object
      additionalProperties: true
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    RateLimited:
      description: 429 du serveur (`ApiError`) ou de la limite par IP de la bibliothèque (`AuthError`).
      oneOf:
        - $ref: '#/components/schemas/ApiError'
        - $ref: '#/components/schemas/AuthError'
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok
    Ready:
      type: object
      additionalProperties: false
      required: [status, initialized]
      properties:
        status:
          const: ready
        initialized:
          type: boolean
    NotReady:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          const: not_ready
        reason:
          type: string
          enum: [schema_version, database]
    Role:
      type: string
      enum: [owner, admin, member]
    Theme:
      type: string
      enum: [light, dark, system]
    Locale:
      type: string
      enum: [en, fr]
    ApiKeyScope:
      type: string
      enum: [apis:read, apis:run, apis:write, runs:read, datasets:read, schedules:write, sites:read]
    SetupRequest:
      type: object
      additionalProperties: false
      required: [token, email, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 1024
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
        displayName:
          type: string
          maxLength: 100
        instanceContact:
          type: string
          maxLength: 400
          description: "Contact de l'opérateur de l'instance (URL http(s), mailto: ou adresse électronique) ; annoncé par le robot quand identify_instance est activé (17 §5)."
    SetupResult:
      type: object
      additionalProperties: false
      required: [userId, keyFingerprint, reminder]
      properties:
        userId:
          type: string
          format: uuid
        keyFingerprint:
          type: string
        reminder:
          type: string
    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 1024
        rememberMe:
          type: boolean
    AuthUser:
      type: object
      additionalProperties: true
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
    SignInResult:
      type: object
      additionalProperties: true
      required: [user]
      properties:
        redirect:
          type: boolean
        user:
          $ref: '#/components/schemas/AuthUser'
        twoFactorRequired:
          description: Compte à 2FA (13 § 7) ; la session reste en attente du second facteur (`POST /api/auth/two-factor/verify`).
          type: boolean
        notices:
          $ref: '#/components/schemas/AccountNotices'
    SessionInfo:
      type: object
      additionalProperties: true
      required: [user]
      properties:
        session:
          type: object
          additionalProperties: true
        user:
          $ref: '#/components/schemas/AuthUser'
    Permission:
      description: Permission de la matrice des rôles (13 § 2), nom de `packages/core/src/auth/roles.ts`.
      type: string
      enum:
        - 'account:update'
        - 'account:mfa'
        - 'account:sessions'
        - 'apikeys:manage'
        - 'users:invite'
        - 'users:list'
        - 'users:deactivate'
        - 'users:delete'
        - 'users:set_role'
        - 'owner:transfer'
        - 'users:revoke_sessions'
        - 'apis:create'
        - 'apis:update'
        - 'apis:delete'
        - 'schedules:manage'
        - 'apis:read'
        - 'apis:set_visibility'
        - 'apis:run'
        - 'runs:read'
        - 'datasets:read'
        - 'runs:stats'
        - 'sites:connect'
        - 'sites:server_use'
        - 'tunnel:pair'
        - 'sites:read_cookies'
        - 'tunnel:route_other'
        - 'apikeys:read_other'
        - 'tunnel:revoke_other'
        - 'apikeys:revoke_other'
        - 'settings:llm:write'
        - 'settings:proxies:write'
        - 'settings:smtp:write'
        - 'settings:identity:write'
        - 'settings:security:write'
        - 'settings:sso:write'
        - 'audit:read'
        - 'audit:export'
        - 'audit:purge'
    Me:
      type: object
      additionalProperties: false
      required: [id, email, displayName, role, locale, timezone, theme, via, scopes, permissions, mfaEnabled, mfaRequired, mfaEnrollmentRequired]
      properties:
        timezone:
          description: Fuseau IANA du compte (`users.timezone`), null tant qu'il n'est pas posé ; sert aux e-mails, aux messages MCP et au fuseau par défaut d'une planification. Donnée personnelle, jamais déduite de la langue (21b § 1).
          type: [string, 'null']
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        locale:
          type: string
          description: Langue préférée (`users.locale`), code d'une langue du registre de l'instance ; la console retombe sur `en` pour une langue qu'elle ne connaît pas.
        theme:
          $ref: '#/components/schemas/Theme'
        via:
          type: string
          enum: [ui, apikey]
        scopes:
          description: Scopes de la clé d'API ; null pour une session d'interface.
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/ApiKeyScope'
            - type: 'null'
        permissions:
          description: >-
            Permissions que `can(role, …)` (13 § 2) accorde au rôle de l'appelant. La console pilote ses écrans et ses routes
            par cette liste, sans recopier la matrice ; le serveur reste seul juge à chaque requête.
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        mfaEnabled:
          description: 2FA TOTP confirmée et lisible sur le compte.
          type: boolean
        mfaRequired:
          description: >-
            MFA_ENFORCED concerne le rôle de l'appelant (13 § 7) : la 2FA ne peut pas être retirée (`DELETE /api/me/2fa` répond
            403 `mfa_enforced`), la console ne le propose pas.
          type: boolean
        mfaEnrollmentRequired:
          description: >-
            MFA_ENFORCED concerne le rôle et la 2FA n'est pas en place (ni `amr` de l'IdP) : toute route sauf l'enrôlement répond
            403 `mfa_enrollment_required` (13 § 7).
          type: boolean
    MePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        locale:
          description: Code d'une langue livrée (`400 invalid_locale` sinon). Le choix du compte l'emporte sur `Accept-Language`.
          type: string
          minLength: 2
          maxLength: 3
        timezone:
          description: Fuseau IANA contrôlé contre `Intl.supportedValuesOf('timeZone')` (`400 invalid_timezone` sinon) ; null l'efface.
          type: [string, 'null']
          maxLength: 64
        theme:
          $ref: '#/components/schemas/Theme'
    ApiKey:
      type: object
      required: [id, label, prefix, scopes, expiresAt, lastUsedAt, createdAt, revokedAt]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyScope'
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        revokedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    ApiKeyCreate:
      type: object
      additionalProperties: false
      required: [label, scopes]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ApiKeyScope'
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
        currentPassword:
          $ref: '#/components/schemas/CurrentPassword'
    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: Secret en clair, renvoyé une seule fois.
    # ——— Énumérations fermées de 04b § 1 (miroir de packages/core/src/model/enums.ts) ———
    ApiStatus:
      type: string
      enum: [enquete, sain, warning, reparation, erreur, action_requise, bloquee]
    InvestigationPhase:
      type: string
      enum: [access_check, reconnaissance, awaiting_schema_validation, testing, done]
    Visibility:
      type: string
      enum: [private, instance]
    Execution:
      description: Niveaux E1 à E6, du moins cher au plus cher (04 § 3.1).
      type: string
      enum: [fetch, fetch_in_page, playwright, agent_fetch, hybrid, agent]
    Network:
      type: string
      enum: [direct, dc_proxy, res_proxy, tunnel]
    StrategyCreator:
      type: string
      enum: [investigation, repair, user, revert, import]
    RunTrigger:
      type: string
      enum: [mcp, rest, schedule, ui, canary]
    RunState:
      type: string
      enum: [queued, running, waiting_tunnel, succeeded, failed, cancelled, skipped_tunnel_offline, skipped_window, skipped_quota, skipped_status, skipped_overlap]
    RunOutcome:
      type: string
      enum: [clean, degraded, failed]
    FailureClass:
      description: Classe d'échec fermée (04b § 1), ou famille `llm_*` (08 § 1). Code stable, jamais localisé.
      type: string
      pattern: '^(transient|network|rate_limited|forbidden|blocked_by_protection|robots_disallowed|robots_unreachable|payment_required|auth_required|account_limit|not_found|extraction|code_error|run_budget_exceeded|budget_exceeded|llm_[a-z0-9_]+)$'
    ReasonCode:
      description: >-
        Code de raison stable (06 § 4.2 : `retried`, `escalated`, `repaired`, `stale`, `reverted`, `cookie_expired`…),
        traduit par la console ; jamais une phrase.
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
    ReasonMessage:
      description: Phrase générée côté serveur, transmise en code et paramètres (traduite par la console, 06 § 4.1).
      type: object
      additionalProperties: false
      required: [code, params]
      properties:
        code:
          $ref: '#/components/schemas/ReasonCode'
        params:
          type: object
          additionalProperties:
            type: [string, number]
    EventName:
      description: >-
        Noms d'événements du flux SSE (06 § 3). Toute trame porte `id:` (reprise par `Last-Event-ID`), `event:` et
        `data:` (JSON). Un nom ajouté par le serveur (3.1) s'ajoute ici.
      type: string
      enum: [investigation.started, phase.started, schema.proposed, attempt.finished, status.changed, action.required]
    # ——— Objets communs ———
    Cost:
      description: Coût en dollars ; `null` quand le prix est inconnu (jamais 0 par défaut, 08 § 1).
      type: object
      additionalProperties: false
      required: [llm_usd, proxy_usd, total_usd]
      properties:
        llm_usd:
          type: [number, 'null']
        proxy_usd:
          type: [number, 'null']
        compute_usd:
          type: [number, 'null']
        total_usd:
          type: [number, 'null']
        estimated:
          type: boolean
    Tokens:
      type: object
      additionalProperties: false
      required: [in, cached, out, reasoning, estimated]
      properties:
        in:
          type: integer
        cached:
          type: integer
        out:
          type: integer
        reasoning:
          type: integer
        estimated:
          type: boolean
    Requires:
      type: object
      additionalProperties: false
      required: [session_domain, tunnel]
      properties:
        session_domain:
          type: [string, 'null']
        tunnel:
          type: boolean
    NetworkPolicy:
      description: >-
        Modes réseau autorisés pour l'API ; `res_proxy` est un opt-in explicite par API. Une API ne référence un proxy que
        par son identifiant (08 § 2). Jamais de montée réseau après un refus (X4).
      type: object
      additionalProperties: false
      required: [allow]
      properties:
        allow:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Network'
        proxy_ids:
          type: array
          items:
            type: string
            format: uuid
        res_proxy_params:
          type: object
          additionalProperties: false
          properties:
            country:
              type: string
              pattern: '^[a-z]{2}$'
    AccessPolicy:
      description: '`robots` n''a qu''une valeur (INV11) : aucun réglage ne l''ignore.'
      type: object
      additionalProperties: false
      required: [robots]
      properties:
        robots:
          const: respect
        report_id:
          type: [string, 'null']
          format: uuid
        user_agent_contact:
          type: string
    DomainPacing:
      type: object
      additionalProperties: false
      properties:
        min_delay_ms:
          type: integer
          minimum: 0
        max_requests_per_run:
          type: integer
          minimum: 1
        max_wait_ms:
          type: integer
          minimum: 0
    AccessReport:
      description: Rapport d'accès, étape 0 de l'enquête (17 § 2) ; onglet « Accès » en lecture seule.
      type: object
      additionalProperties: false
      required: [id, checked_at, robots, signal]
      properties:
        id:
          type: string
          format: uuid
        checked_at:
          type: string
          format: date-time
        signal:
          description: Pastille Accès du catalogue (vert, orange, rouge).
          type: string
          enum: [allowed, review, disallowed]
        robots:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              type: string
              enum: [allowed, disallowed, absent, unreachable]
            fetched_at:
              type: [string, 'null']
              format: date-time
            rule:
              type: [string, 'null']
        usage_signals:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, value]
            properties:
              kind:
                type: string
              value:
                type: string
        accept_language:
          description: >-
            `Accept-Language` effectif envoyé aux sites cibles : celui d'un Chromium vierge de l'image, le même pour le client HTTP et
            pour le navigateur (21 § 6). Jamais la langue de l'interface, du compte ou du run. `null` : aucun en-tête (un Chromium
            vierge de l'image n'en envoie pas).
          type: [string, 'null']
        llms_txt:
          type: boolean
        payment_offer:
          type: [string, 'null']
        official_api_url:
          type: [string, 'null']
    NextAction:
      type: object
      additionalProperties: false
      required: [tool, args]
      properties:
        tool:
          type: string
        args:
          type: object
          additionalProperties: true
    # ——— API (catalogue, fiche) ———
    ApiSummary:
      description: Ligne du catalogue (= élément de list_apis, plus les colonnes de 06 § 2).
      type: object
      required: [id, slug, description, status, status_reason, stale, execution, network, requires, avg_cost_usd, visibility]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/ApiStatus'
        status_reason:
          oneOf:
            - $ref: '#/components/schemas/ReasonMessage'
            - type: 'null'
        stale:
          type: boolean
        execution:
          oneOf:
            - $ref: '#/components/schemas/Execution'
            - type: 'null'
        network:
          oneOf:
            - $ref: '#/components/schemas/Network'
            - type: 'null'
        requires:
          $ref: '#/components/schemas/Requires'
        avg_cost_usd:
          type: [number, 'null']
        avg_cost_estimated:
          type: boolean
        last_run_at:
          type: [string, 'null']
          format: date-time
        success_rate_30d:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        access_signal:
          type: [string, 'null']
          enum: [allowed, review, disallowed, null]
        visibility:
          $ref: '#/components/schemas/Visibility'
        owner_id:
          type: string
          format: uuid
        pinned:
          type: boolean
        mcp_exposed:
          type: boolean
    ApiList:
      type: object
      additionalProperties: false
      required: [apis, next_cursor]
      properties:
        apis:
          type: array
          items:
            $ref: '#/components/schemas/ApiSummary'
        next_cursor:
          type: [string, 'null']
    ApiDetail:
      description: >-
        Fiche (= get_api, entité Api de 04b § 1). Pour l'admin face à une API avec session d'autrui, `metadata_only`
        vaut true et les schémas, l'échantillon et la stratégie sont absents (13 § 2, INV12).
      allOf:
        - $ref: '#/components/schemas/ApiSummary'
        - type: object
          required: [investigation_phase, current_strategy_version, metadata_only]
          properties:
            metadata_only:
              type: boolean
            project_id:
              type: string
              format: uuid
            investigation_phase:
              oneOf:
                - $ref: '#/components/schemas/InvestigationPhase'
                - type: 'null'
            input_schema:
              type: object
              additionalProperties: true
            output_schema:
              type: object
              additionalProperties: true
            views:
              type: object
              additionalProperties: false
              properties:
                columns:
                  type: array
                  items:
                    type: string
            clean_streak:
              type: integer
            last_signal_at:
              type: [string, 'null']
              format: date-time
            current_strategy_version:
              type: [integer, 'null']
            current_strategy:
              oneOf:
                - $ref: '#/components/schemas/StrategyVersionSummary'
                - type: 'null'
            network_policy:
              $ref: '#/components/schemas/NetworkPolicy'
            access_policy:
              $ref: '#/components/schemas/AccessPolicy'
            access_report:
              oneOf:
                - $ref: '#/components/schemas/AccessReport'
                - type: 'null'
            purpose:
              type: [string, 'null']
            legal_basis:
              type: [string, 'null']
            contains_personal_data:
              type: boolean
            allow_write_actions:
              type: boolean
            max_cost_usd:
              type: [number, 'null']
            budget_daily_usd:
              type: [number, 'null']
            domain_pacing:
              $ref: '#/components/schemas/DomainPacing'
            cost_estimate:
              description: Coût estimé avant lancement (« ~0,002 $, médiane de 10 runs » ou « non estimé »).
              type: object
              additionalProperties: false
              required: [median_usd, sample_size]
              properties:
                median_usd:
                  type: [number, 'null']
                sample_size:
                  type: integer
            session_owner:
              description: Propriétaire de la session utilisée, quand ce n'est pas l'appelant (message de 06 § 2).
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [id, display_name]
                  properties:
                    id:
                      type: string
                      format: uuid
                    display_name:
                      type: string
                - type: 'null'
            recent_runs:
              type: array
              items:
                $ref: '#/components/schemas/RunSummary'
            retention_days:
              type: [integer, 'null']
            created_at:
              type: string
              format: date-time
    ApiCreate:
      description: Entrée de create_api (05 § 4.1).
      type: object
      additionalProperties: false
      required: [description, url]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 2000
        url:
          type: string
          format: uri
          maxLength: 2048
        example_output:
          description: Exemple de sortie facultatif (objet ou tableau JSON).
        auto_validate:
          type: boolean
        network_policy:
          $ref: '#/components/schemas/NetworkPolicy'
        wait_seconds:
          type: integer
          minimum: 0
          maximum: 25
        visibility:
          $ref: '#/components/schemas/Visibility'
        account_site_acknowledged:
          description: Avertissement A11 confirmé (site à compte, 06 § 2).
          type: boolean
    ApiCreated:
      type: object
      additionalProperties: false
      required: [api_id, slug, investigation_phase, proposed_output_schema, sample, access_report]
      properties:
        api_id:
          type: string
          format: uuid
        slug:
          type: string
        investigation_phase:
          oneOf:
            - $ref: '#/components/schemas/InvestigationPhase'
            - type: 'null'
        proposed_output_schema:
          type: [object, 'null']
          additionalProperties: true
        sample:
          type: array
          items:
            type: object
            additionalProperties: true
        access_report:
          oneOf:
            - $ref: '#/components/schemas/AccessReport'
            - type: 'null'
        run_id:
          type: [string, 'null']
          format: uuid
    ApiPatch:
      description: >-
        Champs modifiables. Changer `output_schema` ou `input_schema` déclenche une ré-enquête. `access_policy` n'est pas
        modifiable (INV11) ; une API avec session reste `private`.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 2000
        input_schema:
          type: object
          additionalProperties: true
        output_schema:
          type: object
          additionalProperties: true
        views:
          type: object
          additionalProperties: false
          properties:
            columns:
              type: array
              items:
                type: string
        network_policy:
          $ref: '#/components/schemas/NetworkPolicy'
        mcp_exposed:
          type: boolean
        pinned:
          type: boolean
        visibility:
          $ref: '#/components/schemas/Visibility'
        purpose:
          type: [string, 'null']
          maxLength: 2000
        legal_basis:
          type: [string, 'null']
          maxLength: 2000
        contains_personal_data:
          type: boolean
        max_cost_usd:
          type: [number, 'null']
          minimum: 0
        budget_daily_usd:
          type: [number, 'null']
          minimum: 0
        retention_days:
          type: [integer, 'null']
          minimum: 1
    ApiExport:
      description: Export portable d'une API (16 § 6), sans secret, session ni cookie ; format figé par la tâche 3.12.
      type: object
      additionalProperties: true
      required: [format_version, api]
      properties:
        format_version:
          type: integer
        api:
          type: object
          additionalProperties: true
    ValidateSchemaRequest:
      type: object
      additionalProperties: false
      properties:
        output_schema:
          type: object
          additionalProperties: true
        exclude_executions:
          description: Plan d'essais restreint avant exécution (06 § 2, tâche 3.5), dans les bornes de la politique réseau ; jamais d'ajout.
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Execution'
        wait_seconds:
          type: integer
          minimum: 0
          maximum: 25
    InvestigateRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 2000
        exclude_executions:
          description: Plan d'essais restreint avant exécution (06 § 2), dans les bornes de la politique réseau.
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Execution'
    # ——— Runs ———
    RunRequest:
      description: Entrée de run_api (05 § 4.1), validée contre `input_schema` (400 `invalid_input`, aucun run créé).
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input:
          type: object
          additionalProperties: true
        force_investigate:
          type: boolean
        strategy_version:
          description: Relance avec une version précise (courante ou d'origine, 06 § 2).
          type: integer
          minimum: 1
    RunAccepted:
      type: object
      additionalProperties: false
      required: [run_id, state]
      properties:
        run_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/RunState'
        poll_after_seconds:
          type: [integer, 'null']
    RunResult:
      description: Enveloppe commune des sorties d'exécution (05 § 4.1), identique en MCP et en REST.
      type: object
      additionalProperties: false
      required: [run_id, state, status, items, total, dataset_id, truncated, next_cursor, degraded_reasons, message, next_action, poll_after_seconds, timeline, cost, console_url]
      properties:
        run_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/RunState'
        status:
          $ref: '#/components/schemas/ApiStatus'
        items:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: true
        total:
          type: [integer, 'null']
        dataset_id:
          type: [string, 'null']
          format: uuid
        truncated:
          type: boolean
        next_cursor:
          type: [string, 'null']
        degraded_reasons:
          type: array
          items:
            $ref: '#/components/schemas/ReasonCode'
        message:
          type: string
        next_action:
          oneOf:
            - $ref: '#/components/schemas/NextAction'
            - type: 'null'
        poll_after_seconds:
          type: [integer, 'null']
        timeline:
          type: array
          items:
            type: object
            additionalProperties: true
        cost:
          $ref: '#/components/schemas/Cost'
        console_url:
          type: string
    RunCancelled:
      type: object
      additionalProperties: false
      required: [run_id, state, cost]
      properties:
        run_id:
          type: string
          format: uuid
        state:
          const: cancelled
        cost:
          $ref: '#/components/schemas/Cost'
    RunSummary:
      description: 'Métadonnées d''un run (état, coût, durée, nombre d''items) : seule vue de l''admin sur les runs d''autrui.'
      type: object
      required: [id, api_id, api_slug, owner_id, trigger, state, outcome, degraded_reasons, failure_class, created_at, started_at, finished_at, duration_ms, cost, items]
      properties:
        id:
          type: string
          format: uuid
        api_id:
          type: string
          format: uuid
        api_slug:
          type: string
        owner_id:
          type: string
          format: uuid
        strategy_version:
          type: [integer, 'null']
        trigger:
          $ref: '#/components/schemas/RunTrigger'
        state:
          $ref: '#/components/schemas/RunState'
        outcome:
          oneOf:
            - $ref: '#/components/schemas/RunOutcome'
            - type: 'null'
        degraded_reasons:
          type: array
          items:
            $ref: '#/components/schemas/ReasonCode'
        failure_class:
          oneOf:
            - $ref: '#/components/schemas/FailureClass'
            - type: 'null'
        retryable:
          type: boolean
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
        duration_ms:
          type: [integer, 'null']
        cost:
          $ref: '#/components/schemas/Cost'
        items:
          type: [integer, 'null']
        dataset_id:
          type: [string, 'null']
          format: uuid
        retention_until:
          type: [string, 'null']
          format: date-time
    RunList:
      type: object
      additionalProperties: false
      required: [runs, next_cursor]
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        next_cursor:
          type: [string, 'null']
    RunAttempt:
      description: Un essai de la cascade (exécution × réseau × résultat × coût) ; un essai élagué n'a pas été lancé (INV2).
      type: object
      additionalProperties: false
      required: [index, execution, network, state, est_cost_usd, result, cost_usd, ms]
      properties:
        index:
          type: integer
        execution:
          $ref: '#/components/schemas/Execution'
        network:
          $ref: '#/components/schemas/Network'
        state:
          type: string
          enum: [running, done, pruned]
        pruned_reason:
          type: [string, 'null']
        est_cost_usd:
          type: [number, 'null']
        result:
          description: '`ok`, ou la classe d''échec de l''essai.'
          type: [string, 'null']
        cost_usd:
          type: [number, 'null']
        ms:
          type: [integer, 'null']
        model_id:
          type: [string, 'null']
        prompt_version:
          type: [string, 'null']
        engine:
          type: [string, 'null']
        tokens:
          $ref: '#/components/schemas/Tokens'
        error:
          description: Onglet Erreur (Où, Quoi, Pourquoi, Que faire) en codes stables ; absent pour l'admin sur un run d'autrui.
          oneOf:
            - $ref: '#/components/schemas/ReasonMessage'
            - type: 'null'
    Run:
      description: Détail d'un run (entité Run de 04b § 1) ; `metadata_only` pour l'admin face au run avec session d'autrui.
      allOf:
        - $ref: '#/components/schemas/RunSummary'
        - type: object
          required: [metadata_only, attempts, tokens]
          properties:
            metadata_only:
              type: boolean
            attempts:
              type: array
              items:
                $ref: '#/components/schemas/RunAttempt'
            tokens:
              $ref: '#/components/schemas/Tokens'
            trace_id:
              type: [string, 'null']
            paused_at:
              # Extension de 05 § 4.2 (tâche 3.5, à livrer par 3.1 avec POST /api/runs/{id}/pause) : la console relit la pause
              # à la réouverture d'une enquête, au lieu de la garder seulement en mémoire.
              description: Date de la pause demandée par l'utilisateur (`POST /api/runs/{id}/pause`) ; null hors pause, remis à null par `resume`.
              type: [string, 'null']
              format: date-time
            input:
              description: Entrée du run ; absente pour l'admin sur un run d'autrui.
              type: object
              additionalProperties: true
    RunLogLine:
      type: object
      additionalProperties: false
      required: [seq, at, level, code]
      properties:
        seq:
          type: integer
        at:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        code:
          type: string
        attempt:
          type: [integer, 'null']
        data:
          type: object
          additionalProperties: true
    RunLogList:
      type: object
      additionalProperties: false
      required: [lines, next_after]
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/RunLogLine'
        next_after:
          type: [integer, 'null']
    DatasetItems:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        next_cursor:
          type: [string, 'null']
    # ——— Stratégies et statut ———
    StrategyVersionSummary:
      type: object
      required: [version, execution, network, est_cost_usd, created_by, parent_version, created_at]
      properties:
        version:
          type: integer
        execution:
          $ref: '#/components/schemas/Execution'
        network:
          $ref: '#/components/schemas/Network'
        est_cost_usd:
          type: [number, 'null']
        created_by:
          $ref: '#/components/schemas/StrategyCreator'
        parent_version:
          type: [integer, 'null']
        created_at:
          type: string
          format: date-time
        validated_samples:
          type: [integer, 'null']
        run_id:
          description: Enquête ou réparation qui a produit la version.
          type: [string, 'null']
          format: uuid
    StrategyVersion:
      allOf:
        - $ref: '#/components/schemas/StrategyVersionSummary'
        - type: object
          required: [spec, script_ref]
          properties:
            spec:
              description: Stratégie déclarative (04b § 2), ou null si la version est un script.
              type: [object, 'null']
              additionalProperties: true
            script_ref:
              type: [string, 'null']
            patch:
              description: Patch RFC 6902 (version produite par une réparation).
              type: [array, 'null']
              items:
                type: object
                additionalProperties: true
    StrategyVersionList:
      type: object
      additionalProperties: false
      required: [versions, next_cursor]
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/StrategyVersionSummary'
        next_cursor:
          type: [string, 'null']
    StrategyDiff:
      description: Diff à trois niveaux (06 § 2) ; la phrase est un code de raison avec ses paramètres.
      type: object
      additionalProperties: false
      required: [from, to, summary, fields, raw]
      properties:
        from:
          type: integer
        to:
          type: integer
        summary:
          $ref: '#/components/schemas/ReasonMessage'
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, change]
            properties:
              path:
                type: string
              change:
                type: string
                enum: [added, removed, changed]
              before: {}
              after: {}
        raw:
          type: object
          additionalProperties: false
          required: [before, after]
          properties:
            before:
              type: [object, 'null']
              additionalProperties: true
            after:
              type: [object, 'null']
              additionalProperties: true
    StatusEvent:
      type: object
      additionalProperties: false
      required: [id, at, from_status, to_status, reason, run_id]
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        from_status:
          oneOf:
            - $ref: '#/components/schemas/ApiStatus'
            - type: 'null'
        to_status:
          $ref: '#/components/schemas/ApiStatus'
        transition:
          type: [integer, 'null']
        reason:
          oneOf:
            - $ref: '#/components/schemas/ReasonMessage'
            - type: 'null'
        failure_class:
          oneOf:
            - $ref: '#/components/schemas/FailureClass'
            - type: 'null'
        run_id:
          type: [string, 'null']
          format: uuid
    StatusEventList:
      type: object
      additionalProperties: false
      required: [events, next_cursor]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/StatusEvent'
        next_cursor:
          type: [string, 'null']
    # ——— Planifications (08 § 5) ———
    ScheduleRules:
      type: object
      additionalProperties: false
      properties:
        only_if_tunnel_online:
          type: boolean
        window:
          type: [object, 'null']
          additionalProperties: false
          required: [start, end]
          properties:
            start:
              type: string
              pattern: '^\d{2}:\d{2}$'
            end:
              type: string
              pattern: '^\d{2}:\d{2}$'
            days:
              type: array
              items:
                type: integer
                minimum: 0
                maximum: 6
        max_runs_per_day:
          type: [integer, 'null']
          minimum: 1
        skip_if_status_in:
          description: Défaut `[erreur, action_requise, bloquee]` (on ne sollicite pas un site qui a refusé).
          type: array
          items:
            $ref: '#/components/schemas/ApiStatus'
        dedup_key:
          type: [string, 'null']
        diff:
          type: [string, 'null']
          enum: [new, changed, removed, all, null]
        alert_on:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [new_items, status_change, error]
    ScheduleWrite:
      type: object
      additionalProperties: false
      required: [cron, timezone, input]
      properties:
        cron:
          type: string
          maxLength: 100
        timezone:
          type: string
          maxLength: 64
        input:
          description: Entrée du run ; variables datées `{{today}}`, `{{yesterday}}`.
          type: object
          additionalProperties: true
        overlap:
          type: string
          enum: [skip, queue, allow]
          default: skip
        missed:
          type: string
          enum: [once, skip]
          default: once
        rules:
          $ref: '#/components/schemas/ScheduleRules'
        enabled:
          type: boolean
    SchedulePatch:
