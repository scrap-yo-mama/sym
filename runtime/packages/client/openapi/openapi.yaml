        personal:
          type: boolean
        suspected_personal:
          type: boolean
        fill_rate:
          type: number
        sentinel_rate:
          type: number
        top_pattern:
          type: [string, 'null']
        patterns:
          type: object
          additionalProperties:
            type: number
        unique_rate:
          type: number
        distinct:
          type: integer
        constant:
          type: boolean
        length:
          type: object
          required: [min, max, mean]
          properties:
            min:
              type: number
            max:
              type: number
            mean:
              type: number
        min:
          description: Champs non personnels seulement.
          type: number
        max:
          description: Champs non personnels seulement.
          type: number
    RunJudge:
      type: object
      additionalProperties: false
      required: [flag, trigger, verdicts]
      properties:
        flag:
          type: boolean
        trigger:
          type: string
          enum: [investigation, repair, anomaly]
        at:
          type: string
          format: date-time
        verdicts:
          type: array
          items:
            type: object
            additionalProperties: false
