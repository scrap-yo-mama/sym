packages:
  - packages/*
  - apps/*
  - fixtures
  # Paquet d'évaluation isolé du spike 0.6a (protocole §13) : seul endroit où Stagehand est installé.
  - eval/spike

# Catalogue unique : versions exactes (aucune plage ouverte), une seule source de vérité.
catalog:
  typescript: 5.9.3
  '@types/node': 24.13.6
  vitest: 5.0.1
  fast-check: 4.10.2
  '@playwright/test': 1.63.0
  fastify: 5.12.5
  # Passerelle tunnel WSS (tâche 2.7, 03 « Serveur HTTP ») : @fastify/websocket 11.3.1 (MIT, 2026-09-18), ws 8.21.3 (MIT ; 8.22.0 < 7 jours au 2026-10-01, minimumReleaseAge), @types/ws 8.18.1 (8.18.2 < 7 jours).
  '@fastify/websocket': 11.3.1
  ws: 8.21.3
  # Console servie par le serveur (fix-console-served, 03 « Serveur HTTP » : Fastify 5 + @fastify/static) : @fastify/static 10.1.4 (MIT, 2026-09-17 ; 10.1.5 < 7 jours au 2026-10-02, minimumReleaseAge).
  '@fastify/static': 10.1.4
  '@types/ws': 8.18.1
  pino: 10.3.1
  # Outillage qualité (tâche 0.8)
  eslint: 10.11.0
  '@eslint/js': 10.0.1
  typescript-eslint: 8.70.1
  knip: 6.37.0
  '@vitest/coverage-v8': 5.0.1
  # Base (tâche 0.2)
  drizzle-orm: 0.45.3
  pg: 8.23.0
  '@types/pg': 8.23.1
  '@testcontainers/postgresql': 12.1.0
  # Auth noyau (tâche 0.3b) : version exacte, 13 § 5
  better-auth: 1.7.5
  # OIDC générique (tâche 3.7, 13 § 7 : « openid-client 6.x, pas le plugin SSO ») : MIT, dépendances jose et oauth4webapi (MIT) ;
  # 6.8.8 publiée le 2026-09-05 (plus de 7 jours, minimumReleaseAge).
  openid-client: 6.8.8
  # Couche LLM (tâche 0.4). msw 2.15.0 : msw 3.0.x a moins de 7 jours (minimumReleaseAge).
  ajv: 8.20.0
  msw: 2.15.0
  # Garde SSRF (tâche 0.7) : fetch épinglé à undici (8.11.1 et 8.11.2 < 7 jours au 2026-09-30, minimumReleaseAge).
  undici: 8.11.0
  # DSL déclaratif (tâche 1.1b) : JSONPath RFC 9535 (json-p3, MIT, sans dépendance, sans eval ; 2.3.2 publié sans fichiers de types) ; CSS + HTML (css-select, htmlparser2, domhandler : BSD-2/MIT, sans eval).
  json-p3: 2.3.1
  css-select: 7.0.0
  htmlparser2: 12.0.0
  domhandler: 6.0.1
  # File de jobs (tâche 1.3, T2 R1) : 12.x figée ; 12.34.1+ et 12.35.x < 7 jours au 2026-10-01 (minimumReleaseAge).
  pg-boss: 12.34.0
  # Console (tâche 3.3, ADR 0002) : dernières versions publiées depuis plus de 7 jours au 2026-10-01 (minimumReleaseAge).
  vue: 3.5.43
  vite: 8.3.0
  '@vitejs/plugin-vue': 6.0.9
  vue-router: 5.3.1
  vue-tsc: 3.3.11
  vue-i18n: 11.4.12
  tailwindcss: 4.3.3
  '@tailwindcss/vite': 4.3.3
  reka-ui: 2.10.5
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  # Même version que celle de reka-ui (une seule copie dans l'arbre) ; utilisée par les composants shadcn-vue copiés.
  '@vueuse/core': 14.4.0
  # Client API (tâche 3.3) : types générés par openapi-typescript depuis l'OpenAPI spécifiée, appels par openapi-fetch.
  openapi-fetch: 0.17.0
  openapi-typescript: 7.13.0
  # Validation structurelle de l'OpenAPI SERVIE (tâche 3.1, assert_openapi_served_valid, règle `struct`) : MIT, déjà dans l'arbre
  # par openapi-typescript (même version, une seule copie) ; 1.34.20 publiée il y a plus de 7 jours (minimumReleaseAge).
  '@redocly/openapi-core': 1.34.20
  # Aide cron des planifications (tâche 3.4, 06 § 2 « Cron ») : MIT, sans dépendance ; 3.27.0 publiée le 2026-09-15 (plus de 7 jours).
  cronstrue: 3.27.0
  # Lint des composants .vue (tâche 3.3).
  eslint-plugin-vue: 10.11.0
  vue-eslint-parser: 10.4.1
  # Webhooks (tâche 2.5) : bibliothèque de référence Standard Webhooks, devDependency d'oracle de test (08 § 7 : « la signature v1
  # se vérifie avec la bibliothèque de référence »). MIT ; 1.1.1 publiée le 2026-08-28.
  standardwebhooks: 1.1.1
  # Observabilité (tâche 1.10) : traces OTel opt-in (chargées à la demande seulement). Métriques Prometheus écrites à la
  # main (apps/server/src/metrics.ts) : prom-client 15 exige `@opentelemetry/api` (require statique), ce qui chargerait
  # l'API OTel dans tout `server` même OTel coupé (assert_otel_off_by_default).
  # 0.222.0 (31/08) : versions les plus récentes de plus de 7 jours au 2026-10-01 (minimumReleaseAge).
  '@opentelemetry/api': 1.9.1
  '@opentelemetry/context-async-hooks': 2.11.0
  '@opentelemetry/resources': 2.11.0
  '@opentelemetry/sdk-trace-base': 2.11.0
  '@opentelemetry/exporter-trace-otlp-http': 0.222.0
  '@opentelemetry/exporter-trace-otlp-proto': 0.222.0
  # Extension (tâche 2.6, 07 § 7) : WXT 0.21.4 épinglé, popup en Vue 3.5 (fonctions de rendu, sans SFC ni compilateur de gabarits : CSP MV3) ; vite 8.3.0 (8.3.1 < 7 jours au 2026-10-01).
  wxt: 0.21.4
  # Moteur agentique (tâche 0.6a) et exécuteurs E2-E3 (tâche 1.6) : Playwright 1.63 (Chromium 153), noyau sans navigateurs embarqués (image Playwright), même version que @playwright/test.
  playwright-core: 1.63.0
  # Moteur agentique serveur retenu par l’ADR 0001 (Stagehand 3.7.3, mode dom, local seulement), intégré en production par la
  # tâche 2.4 dans packages/agent ; zod 4.3.6 : schéma de sortie attendu par `agent().execute({ output })`.
  "@browserbasehq/stagehand": 3.7.3
  zod: 4.3.6
  # Téléphones des sujets en E.164 (tâche 1.8, D-25) : MIT, sans dépendance ; 1.13.14 < 7 jours au 2026-10-01 (minimumReleaseAge).
  libphonenumber-js: 1.13.13
  # Accessibilité (tâche 3.9, 06 § 1) : adaptateur Playwright d'axe-core (MPL-2.0, compatible AGPL), 4.13.0 publiée le 2026-08-11 ; il tire axe-core ~4.13.0 (4.13.0, 2026-08-05), figé par le lockfile. Plus de 7 jours.
  '@axe-core/playwright': 4.13.0
  # Bac à sable (tâche 1.5) : isolated-vm 7.0.1 corrige GHSA-864f-rcv7-6rh4 (<= 7.0.0) et porte les binaires Node 24 (ABI 137)
  # et Node 26 (ABI 147) ; 6.2.0 (corrigée aussi) s'arrête à Node 24. Spike QuickJS : devDependencies, MIT.
  isolated-vm: 7.0.1
  quickjs-emscripten-core: 0.32.0
  '@jitl/quickjs-wasmfile-release-sync': 0.32.0
  # Déploiements (tâche 4.1) : lecture de render.yaml, heroku.yml et docker-compose.prod.yml par les tests statiques (ISC ;
  # déjà dans le lockfile en dépendance transitive de vite, 2.9.1 publiée le 2026-09-11, plus de 7 jours).
  yaml: 2.9.1

  # Site de doc (tâche 4.8, 16 § 4) : VitePress 2.0.0-alpha.20 (la 1.6.4 tire vite 5.4.21, refusé par la politique de confiance pnpm no-downgrade ; la 2.x tire vite 8, comme la console), Pagefind 1.5.2 (MIT, index statique,
  # binaire par plate-forme en optionalDependencies, sans script d'installation) ; yaml (déclaré plus haut, tâche 4.1) sert aussi à lire l'OpenAPI spécifiée.
  vitepress: 2.0.0-alpha.20
  pagefind: 1.5.2
  # Frontières entre modules (tâche 5.0, docs/modules.md) : rapport dependency-cruiser du nightly, NON bloquant ; MIT ;
  # 18.4.0 publiée le 2026-09-20 (plus de 7 jours au 2026-10-02, minimumReleaseAge ; 18.5.0 du 2026-09-30 < 7 jours).
  dependency-cruiser: 18.4.0

# OTel coupé = aucun module de l'API ni du SDK résolu (14 § 10, assert_otel_off_by_default). Better Auth
# (@better-auth/core) fait `import("@opentelemetry/api")` à chaque requête d'auth ; drizzle-orm et vitest déclarent le même
# pair optionnel. pnpm 11 résout un pair optionnel dès qu'une version existe dans le graphe (ici via @runtime/core) : le
# crochet `readPackage` de .pnpmfile.cjs retire ce pair de ces trois paquets, et `@opentelemetry/*` n'est pas hissé dans
# node_modules/.pnpm/node_modules. L'import de Better Auth échoue alors et il reste en no-op ; seul @runtime/core résout
# l'API et le SDK, dynamiquement, quand OTEL_ENABLED=true. Contrôlé sur un vrai server + worker
# (tests/observability.integration.test.ts).
hoistPattern:
  - '*'
  - '!@opentelemetry/*'

# Durcissement supply chain (08b §5). Le durcissement complet est la tâche 0.8.
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade
strictDepBuilds: true
engineStrict: true
allowBuilds:
  esbuild: true
  # Testcontainers (tâche 0.2) : scripts facultatifs refusés (liaisons natives optionnelles de ssh2, contrôle de version de protobufjs).
  cpu-features: false
  protobufjs: false
  ssh2: false
  # msw (tâche 0.4) : postinstall = copie du service worker navigateur, inutile côté Node.
  msw: false
  # Console (tâche 3.3) : postinstall de vue-demi (choix Vue 2/3 pour @vueuse via reka-ui), inutile : Vue 3 est la version par défaut.
  vue-demi: false
  # isolated-vm (tâche 1.5) : module natif ; node-gyp-build charge le binaire précompilé, sinon compile.
  isolated-vm: true
  # Stagehand (spike 0.6a, eval/spike) : preinstall de @google/genai = « echo no-op », refusé.
  '@google/genai': false

# Spike 0.6a : Stagehand 3.7.3 demande pino ^9 ; pino@9.14.0 est refusé par trustPolicy (no-downgrade).
# On le remplace par le pino épinglé du projet (10.3.1, déjà approuvé) plutôt que d'affaiblir la politique.
# Stagehand tourne avec disablePino: true (protocole §3).
overrides:
  '@browserbasehq/stagehand>pino': 10.3.1
  # Stagehand 3.7.3 importe STATIQUEMENT tous ses fournisseurs @ai-sdk/*, ollama-ai-provider-v2 et chrome-launcher
  # (dépendances « facultatives » en fait obligatoires) : ils restent. Seul bufferutil (module natif facultatif de ws,
  # non importé par Stagehand) est retiré.
  '@browserbasehq/stagehand>bufferutil': '-'
  # @ai-sdk/provider-utils@3 (via @ai-sdk/openai) demande undici ^5.29.0 ; 5.29.0 est refusé par trustPolicy (sans provenance).
  # undici n'y sert qu'aux téléchargements (Agent + fetch, API identique en 6.x) : remplacé par 6.28.1 (provenance, > 7 jours).
  '@ai-sdk/provider-utils>undici': 6.28.1
