packages:
  - packages/*
  - apps/*
  - fixtures

# Catalogue unique : versions exactes (aucune plage ouverte), une seule source de vérité.
catalog:
  typescript: 5.9.3
  '@types/node': 24.13.6
  vitest: 5.0.1
  fast-check: 4.10.2
  '@playwright/test': 1.63.0
  fastify: 5.12.5
  pino: 10.3.1
  # Outillage qualité (tâche 0.8)
  eslint: 10.11.0
  '@eslint/js': 10.0.1
  typescript-eslint: 8.70.1
  knip: 6.37.0
  '@vitest/coverage-v8': 5.0.1
  # Base (tâche 0.2)
  drizzle-orm: 0.45.3
  pg: 8.23.0
  '@types/pg': 8.23.1
  '@testcontainers/postgresql': 12.1.0
  # Auth noyau (tâche 0.3b) : version exacte, 13 § 5
  better-auth: 1.7.5
  # Couche LLM (tâche 0.4). msw 2.15.0 : msw 3.0.x a moins de 7 jours (minimumReleaseAge).
  ajv: 8.20.0
  msw: 2.15.0
  # Garde SSRF (tâche 0.7) : fetch épinglé à undici (8.11.1 et 8.11.2 < 7 jours au 2026-09-30, minimumReleaseAge).
  undici: 8.11.0
  # DSL déclaratif (tâche 1.1b) : JSONPath RFC 9535 (json-p3, MIT, sans dépendance, sans eval ; 2.3.2 publié sans fichiers de types) ; CSS + HTML (css-select, htmlparser2, domhandler : BSD-2/MIT, sans eval).
  json-p3: 2.3.1
  css-select: 7.0.0
  htmlparser2: 12.0.0
  domhandler: 6.0.1
  # File de jobs (tâche 1.3, T2 R1) : 12.x figée ; 12.34.1+ et 12.35.x < 7 jours au 2026-10-01 (minimumReleaseAge).
  pg-boss: 12.34.0
  # Console (tâche 3.3, ADR 0002) : dernières versions publiées depuis plus de 7 jours au 2026-10-01 (minimumReleaseAge).
  vue: 3.5.43
  vite: 8.3.0
  '@vitejs/plugin-vue': 6.0.9
  vue-router: 5.3.1
  vue-tsc: 3.3.11
  vue-i18n: 11.4.12
  tailwindcss: 4.3.3
  '@tailwindcss/vite': 4.3.3
  reka-ui: 2.10.5
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  tw-animate-css: 1.4.0
  # Même version que celle de reka-ui (une seule copie dans l'arbre) ; utilisée par les composants shadcn-vue copiés.
  '@vueuse/core': 14.4.0
  # Client API (tâche 3.3) : types générés par openapi-typescript depuis l'OpenAPI spécifiée, appels par openapi-fetch.
  openapi-fetch: 0.17.0
  openapi-typescript: 7.13.0
  # Lint des composants .vue (tâche 3.3).
  eslint-plugin-vue: 10.11.0
  vue-eslint-parser: 10.4.1

# Durcissement supply chain (08b §5). Le durcissement complet est la tâche 0.8.
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade
strictDepBuilds: true
engineStrict: true
allowBuilds:
  esbuild: true
  # Testcontainers (tâche 0.2) : scripts facultatifs refusés (liaisons natives optionnelles de ssh2, contrôle de version de protobufjs).
  cpu-features: false
  protobufjs: false
  ssh2: false
  # msw (tâche 0.4) : postinstall = copie du service worker navigateur, inutile côté Node.
  msw: false
  # Console (tâche 3.3) : postinstall de vue-demi (choix Vue 2/3 pour @vueuse via reka-ui), inutile : Vue 3 est la version par défaut.
  vue-demi: false
