packages:
  - packages/*
  - apps/*
  - fixtures

# Catalogue unique : versions exactes (aucune plage ouverte), une seule source de vérité.
catalog:
  typescript: 5.9.3
  '@types/node': 24.13.6
  vitest: 5.0.1
  fast-check: 4.10.2
  '@playwright/test': 1.63.0
  fastify: 5.12.5
  pino: 10.3.1
  # Outillage qualité (tâche 0.8)
  eslint: 10.11.0
  '@eslint/js': 10.0.1
  typescript-eslint: 8.70.1
  knip: 6.37.0
  '@vitest/coverage-v8': 5.0.1
  # Base (tâche 0.2)
  drizzle-orm: 0.45.3
  pg: 8.23.0
  '@types/pg': 8.23.1
  '@testcontainers/postgresql': 12.1.0
  # Auth noyau (tâche 0.3b) : version exacte, 13 § 5
  better-auth: 1.7.5
  # Couche LLM (tâche 0.4). msw 2.15.0 : msw 3.0.x a moins de 7 jours (minimumReleaseAge).
  ajv: 8.20.0
  msw: 2.15.0
  # Garde SSRF (tâche 0.7) : fetch épinglé à undici (8.11.1 et 8.11.2 < 7 jours au 2026-09-30, minimumReleaseAge).
  undici: 8.11.0
  # DSL déclaratif (tâche 1.1b) : JSONPath RFC 9535 (json-p3, MIT, sans dépendance, sans eval ; 2.3.2 publié sans fichiers de types) ; CSS + HTML (css-select, htmlparser2, domhandler : BSD-2/MIT, sans eval).
  json-p3: 2.3.1
  css-select: 7.0.0
  htmlparser2: 12.0.0
  domhandler: 6.0.1
  # File de jobs (tâche 1.3, T2 R1) : 12.x figée ; 12.34.1+ et 12.35.x < 7 jours au 2026-10-01 (minimumReleaseAge).
  pg-boss: 12.34.0
  # Webhooks (tâche 2.5) : bibliothèque de référence Standard Webhooks, devDependency d'oracle de test (08 § 7 : « la signature v1
  # se vérifie avec la bibliothèque de référence »). MIT ; 1.1.1 publiée le 2026-08-28.
  standardwebhooks: 1.1.1
  # Observabilité (tâche 1.10) : traces OTel opt-in (chargées à la demande seulement). Métriques Prometheus écrites à la
  # main (apps/server/src/metrics.ts) : prom-client 15 exige `@opentelemetry/api` (require statique), ce qui chargerait
  # l'API OTel dans tout `server` même OTel coupé (assert_otel_off_by_default).
  # 0.222.0 (31/08) : versions les plus récentes de plus de 7 jours au 2026-10-01 (minimumReleaseAge).
  '@opentelemetry/api': 1.9.1
  '@opentelemetry/context-async-hooks': 2.11.0
  '@opentelemetry/resources': 2.11.0
  '@opentelemetry/sdk-trace-base': 2.11.0
  '@opentelemetry/exporter-trace-otlp-http': 0.222.0
  '@opentelemetry/exporter-trace-otlp-proto': 0.222.0
  # Extension (tâche 2.6, 07 § 7) : WXT 0.21.4 épinglé, popup en Vue 3.5 (fonctions de rendu, sans SFC ni compilateur de gabarits : CSP MV3) ; vite 8.3.0 (8.3.1 < 7 jours au 2026-10-01).
  wxt: 0.21.4
  vue: 3.5.43
  vite: 8.3.0
  # Téléphones des sujets en E.164 (tâche 1.8, D-25) : MIT, sans dépendance ; 1.13.14 < 7 jours au 2026-10-01 (minimumReleaseAge).
  libphonenumber-js: 1.13.13

# OTel coupé = aucun module de l'API ni du SDK résolu (14 § 10, assert_otel_off_by_default). Better Auth
# (@better-auth/core) fait `import("@opentelemetry/api")` à chaque requête d'auth ; drizzle-orm et vitest déclarent le même
# pair optionnel. pnpm 11 résout un pair optionnel dès qu'une version existe dans le graphe (ici via @runtime/core) : le
# crochet `readPackage` de .pnpmfile.cjs retire ce pair de ces trois paquets, et `@opentelemetry/*` n'est pas hissé dans
# node_modules/.pnpm/node_modules. L'import de Better Auth échoue alors et il reste en no-op ; seul @runtime/core résout
# l'API et le SDK, dynamiquement, quand OTEL_ENABLED=true. Contrôlé sur un vrai server + worker
# (tests/observability.integration.test.ts).
hoistPattern:
  - '*'
  - '!@opentelemetry/*'

# Durcissement supply chain (08b §5). Le durcissement complet est la tâche 0.8.
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade
strictDepBuilds: true
engineStrict: true
allowBuilds:
  esbuild: true
  # Testcontainers (tâche 0.2) : scripts facultatifs refusés (liaisons natives optionnelles de ssh2, contrôle de version de protobufjs).
  cpu-features: false
  protobufjs: false
  ssh2: false
  # msw (tâche 0.4) : postinstall = copie du service worker navigateur, inutile côté Node.
  msw: false
