packages:
  - packages/*
  - apps/*
  - fixtures

# Catalogue unique : versions exactes (aucune plage ouverte), une seule source de vérité.
catalog:
  typescript: 5.9.3
  '@types/node': 24.13.6
  vitest: 5.0.1
  fast-check: 4.10.2
  '@playwright/test': 1.63.0
  fastify: 5.12.5
  pino: 10.3.1
  # Outillage qualité (tâche 0.8)
  eslint: 10.11.0
  '@eslint/js': 10.0.1
  typescript-eslint: 8.70.1
  knip: 6.37.0
  '@vitest/coverage-v8': 5.0.1
  # Base (tâche 0.2)
  drizzle-orm: 0.45.3
  pg: 8.23.0
  '@types/pg': 8.23.1
  '@testcontainers/postgresql': 12.1.0
  # Auth noyau (tâche 0.3b) : version exacte, 13 § 5
  better-auth: 1.7.5
  # Couche LLM (tâche 0.4). msw 2.15.0 : msw 3.0.x a moins de 7 jours (minimumReleaseAge).
  ajv: 8.20.0
  msw: 2.15.0
  # Garde SSRF (tâche 0.7) : fetch épinglé à undici (8.11.1 et 8.11.2 < 7 jours au 2026-09-30, minimumReleaseAge).
  undici: 8.11.0
  # Bac à sable (tâche 1.5) : isolated-vm 7.0.1 corrige GHSA-864f-rcv7-6rh4 (<= 7.0.0) et porte les binaires Node 24 (ABI 137)
  # et Node 26 (ABI 147) ; 6.2.0 (corrigée aussi) s'arrête à Node 24. Spike QuickJS : devDependencies, MIT.
  isolated-vm: 7.0.1
  quickjs-emscripten-core: 0.32.0
  '@jitl/quickjs-wasmfile-release-sync': 0.32.0

# Durcissement supply chain (08b §5). Le durcissement complet est la tâche 0.8.
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade
strictDepBuilds: true
engineStrict: true
allowBuilds:
  esbuild: true
  # Testcontainers (tâche 0.2) : scripts facultatifs refusés (liaisons natives optionnelles de ssh2, contrôle de version de protobufjs).
  cpu-features: false
  protobufjs: false
  ssh2: false
  # msw (tâche 0.4) : postinstall = copie du service worker navigateur, inutile côté Node.
  msw: false
  # isolated-vm (tâche 1.5) : module natif ; node-gyp-build charge le binaire précompilé, sinon compile.
  isolated-vm: true
