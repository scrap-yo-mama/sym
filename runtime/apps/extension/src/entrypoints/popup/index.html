  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scrapyomama</title>
    <style>
      :root { color-scheme: light dark; font: 14px/1.4 system-ui, sans-serif; }

      h1 { font-size: 16px; margin: 0 0 8px; }
